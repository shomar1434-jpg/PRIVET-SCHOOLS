<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هوية وقالب المدرسة | نظام إدارة المدارس الذكي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-supabase-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:#f1f5f9;color:#0f172a}.head{background:linear-gradient(135deg,#0f172a,#155e75);color:white;padding:28px}.bar,.wrap{width:min(1080px,94vw);margin:auto}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{padding:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:22px;box-shadow:0 10px 30px #0f172a0c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.full{grid-column:1/-1}.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;background:#0f766e;color:#fff;cursor:pointer}.light{background:#e2e8f0;color:#0f172a}.muted{font-size:13px;color:#64748b}.msg{padding:10px;border-radius:12px;background:#f1f5f9;margin-top:12px;display:none}.msg.show{display:block}.preview{margin-top:20px;border:1px solid #cbd5e1;border-radius:18px;padding:20px;background:#fff}.preview .line{border-top:3px solid #0f766e;margin:12px 0}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.bar{align-items:flex-start;flex-direction:column}}</style></head><body><header class="head"><div class="bar"><div><h1 style="margin:0">هوية وقالب المدرسة</h1><div id="who" style="opacity:.8"></div></div><button class="btn light" onclick="back()">عودة</button></div></header><main class="wrap"><section class="card"><h2>بيانات القالب الموحد</h2><p class="muted">تطبق هذه البيانات على تقارير وسجلات المدرسة الخاصة بالمدرسة الحالية فقط.</p><div class="grid"><label>اسم المدرسة<input id="schoolDisplayName" class="field"></label><label>الرقم الوزاري<input id="ministryNumber" class="field"></label><label>المرحلة<select id="schoolStage" class="field"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option><option>رياض أطفال</option><option>متعدد المراحل</option></select></label><label>الإدارة التعليمية<input id="educationAdministration" class="field"></label><label>اسم المالك<input id="ownerDisplayName" class="field"></label><label>اسم المدير/ة<input id="managerDisplayName" class="field"></label><label class="full">بيانات التواصل<input id="contactLine" class="field" placeholder="الهاتف — البريد — الموقع"></label></div><div style="margin-top:14px"><button class="btn" onclick="save()">حفظ القالب سحابياً</button></div><div id="msg" class="msg"></div><div class="preview"><div style="display:flex;justify-content:space-between;gap:10px"><b>وزارة التعليم</b><b id="pSchool">اسم المدرسة</b></div><div class="line"></div><h2 style="text-align:center">القالب المؤسسي الموحد</h2><p id="pMeta" style="text-align:center;color:#64748b"></p><div class="line"></div><div style="display:flex;justify-content:space-between"><span id="pOwner"></span><span id="pManager"></span></div><p id="pContact" class="muted" style="text-align:center"></p></div></section></main><script>
let ctx,profile={};const ids=['schoolDisplayName','ministryNumber','schoolStage','educationAdministration','ownerDisplayName','managerDisplayName','contactLine'];const $=x=>document.getElementById(x);function msg(t,b=false){$('msg').textContent=t;$('msg').className='msg show';$('msg').style.color=b?'#b91c1c':'#166534'}function refresh(){pSchool.textContent=schoolDisplayName.value||ctx?.schoolName||'اسم المدرسة';pMeta.textContent=[educationAdministration.value,schoolStage.value,ministryNumber.value&&('الرقم الوزاري: '+ministryNumber.value)].filter(Boolean).join(' — ');pOwner.textContent='المالك: '+(ownerDisplayName.value||'—');pManager.textContent='المدير/ة: '+(managerDisplayName.value||'—');pContact.textContent=contactLine.value||''}
async function init(){try{ctx=await PrivateSchool.requireRole(['owner','manager']);who.textContent=ctx.schoolName+' — '+ctx.userName;let d=await PrivateSchool.template('get_profile');profile=d.profile||{};ids.forEach(k=>{if($(k))$(k).value=profile[k]||'';$(k)?.addEventListener('input',refresh)});if(!schoolDisplayName.value)schoolDisplayName.value=ctx.schoolName||'';refresh()}catch(e){msg(e.message,true)}}
async function save(){try{let p={...profile};ids.forEach(k=>p[k]=$(k).value.trim());await PrivateSchool.template('save_profile',{profile:p});profile=p;refresh();msg('تم حفظ هوية وقالب المدرسة سحابياً.')}catch(e){msg(e.message,true)}}function back(){location.href=(ctx?.role==='owner'?'private-owner-portal.html':'manager.html')+'?private=1&schoolId='+encodeURIComponent(ctx?.schoolId||PrivateSchool.getSchoolId())}init();
</script></body></html>
