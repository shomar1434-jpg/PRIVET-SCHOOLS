<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول مالك المدرسة الخاصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071827,#0b3940);font-family:Tahoma,Arial;color:#0f172a}.card{width:min(92vw,440px);background:#fff;border-radius:28px;padding:30px;box-shadow:0 24px 80px #0005}.badge{display:inline-block;background:#ecfdf5;color:#047857;padding:7px 12px;border-radius:999px;font-weight:700;font-size:12px}h1{font-size:24px;margin:16px 0 6px}.sub{color:#64748b;font-size:14px;line-height:1.8}.field{margin-top:14px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #cbd5e1;border-radius:14px;font-size:15px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#0f766e;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.msg{min-height:22px;margin-top:12px;color:#b91c1c;font-size:13px}</style><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="private-school-theme.css"></head><body><main class="card"><span class="badge">إصدار المدارس الأهلية والخاصة</span><h1>دخول مالك المدرسة</h1><p class="sub">يتم التحقق عبر Supabase Auth ثم التحقق من ملكية المدرسة الخاصة وصلاحية الحساب.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="login">دخول لوحة المالك</button><div id="msg" class="msg"></div></main><script>document.getElementById('login').onclick=async()=>{const m=document.getElementById('msg');m.textContent='';try{const sid=new URLSearchParams(location.search).get('schoolId')||'';if(!sid)throw new Error('رابط دخول المالك غير مرتبط بمدرسة محددة');const r=await PrivateSchoolBridge.login(document.getElementById('email').value,document.getElementById('password').value,sid,'owner');if(r.context.role!=='owner'||r.context.schoolId!==sid){await PrivateSchoolBridge.logout();throw new Error('هذا الحساب ليس مالكًا لهذه المدرسة الخاصة')}location.href='private-owner-portal.html?privateEdition=1&schoolId='+encodeURIComponent(r.context.schoolId)}catch(e){m.textContent=e.message||'تعذر الدخول'}};</script></body></html>
