<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول مستخدمي المدرسة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-supabase-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#155e75);font-family:Tajawal;color:#0f172a}.card{width:min(470px,92vw);background:white;padding:28px;border-radius:26px;box-shadow:0 25px 70px #0005}.field,.btn{width:100%;padding:12px;border-radius:13px;font:inherit;margin:6px 0}.field{border:1px solid #cbd5e1}.btn{border:0;background:#0f766e;color:white;font-weight:800;cursor:pointer}.muted{font-size:13px;color:#64748b}.msg{padding:10px;background:#f1f5f9;border-radius:10px;display:none}</style></head><body><div class="card"><h1>دخول مستخدمي المدرسة</h1><p class="muted">للوكيل/ة والمعلم/ة والموجه/ة ورائد/ة النشاط والإداري/ة وبقية أعضاء المدرسة.</p><input id="email" class="field" type="email" placeholder="البريد الإلكتروني"><input id="password" class="field" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><button class="btn" style="background:#e2e8f0;color:#0f172a" onclick="location.href='private-entry.html'">عودة</button><div id="msg" class="msg"></div></div><script>async function login(){try{msg.style.display='block';msg.textContent='جار التحقق...';await PrivateSchool.signIn(email.value,password.value);let d=await PrivateSchool.sessionContext(PrivateSchool.params().get('schoolId')||'');if(['owner','manager'].includes(d.context.role))throw new Error('استخدم بوابة المالك أو المدير لهذا الحساب');PrivateSchool.gotoLanding(d.context)}catch(e){msg.textContent=e.message;msg.style.color='#b91c1c'}}</script></body></html>
