<!DOCTYPE html>

<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#102a2a;font-family:Tajawal,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.head{background:linear-gradient(135deg,#104b4b,#168b82);color:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 50px #0f766e22}.head h1{margin:0 0 6px;font-size:24px}.sub{opacity:.9;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.card,.panel{background:#fff;border:1px solid #dbe7e7;border-radius:18px;padding:16px;box-shadow:0 8px 24px #0f172a0a}.num{font-size:28px;font-weight:900;color:#0f766e}.muted{color:#64748b;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #cbd5e1;background:#fff;padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}.tabs button.active{background:#0f766e;color:#fff;border-color:#0f766e}.row{padding:14px;border:1px solid #e2e8f0;border-radius:14px;margin:10px 0}.row h3{margin:0 0 8px;font-size:16px}.status{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#f1f5f9}.s-pending{background:#fef3c7;color:#92400e}.s-return{background:#dbeafe;color:#1d4ed8}.s-reject{background:#fee2e2;color:#991b1b}.s-approved{background:#dcfce7;color:#166534}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button,.primary{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.approve{background:#dcfce7;color:#166534}.return{background:#fef3c7;color:#92400e}.reject{background:#fee2e2;color:#991b1b}.primary{background:#0f766e;color:#fff}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-family:inherit}.field textarea{min-height:86px;resize:vertical}.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:10px;border-radius:12px;color:#1e3a8a;font-size:12px;margin:8px 0}.history{border-right:3px solid #cbd5e1;padding-right:12px;margin-top:10px}.history div{padding:7px 0;font-size:12px}.msg{min-height:22px;margin-top:10px;color:#b91c1c;font-weight:700}.back{color:#fff;text-decoration:none;background:#ffffff22;border:1px solid #ffffff33;padding:8px 11px;border-radius:10px;float:left}
