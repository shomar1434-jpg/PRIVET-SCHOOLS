<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات حالات الانضباط — المدارس الخاصة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="private-school-bridge.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#102a2a;font-family:Tajawal,Arial,sans-serif}.wrap{max-width:1240px;margin:auto;padding:24px}.head{background:linear-gradient(135deg,#0b4d48,#0e7e72 60%,#16a394);color:#fff;border-radius:26px;padding:24px;box-shadow:0 18px 55px #0f766e24;position:relative}.head h1{margin:0 0 7px;font-size:27px}.sub{opacity:.94;font-size:13px}.back{position:absolute;left:18px;top:18px;color:#fff;text-decoration:none;background:#ffffff1f;border:1px solid #ffffff3d;padding:8px 12px;border-radius:11px;font-weight:800}.profile{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}.chip{background:#ffffff18;border:1px solid #ffffff35;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin:16px 0}.card,.panel{background:#fff;border:1px solid #dbe7e7;border-radius:19px;padding:16px;box-shadow:0 8px 24px #0f172a0a}.num{font-size:30px;font-weight:900;color:#0f766e}.muted{color:#64748b;font-size:12px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:18px 0 10px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.ghost{border:1px solid #cbd5e1;background:#fff;padding:10px 14px;border-radius:999px;font-family:inherit;font-weight:800;cursor:pointer}.tabs button.active{background:#0f766e;color:#fff;border-color:#0f766e}.primary{background:#0f766e;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-family:inherit;font-weight:900;cursor:pointer}.primary.big{font-size:15px;padding:12px 18px;box-shadow:0 8px 22px #0f766e2d}.row{padding:14px;border:1px solid #e2e8f0;border-radius:14px;margin:10px 0;background:#fff}.row h3{margin:0 0 10px;font-size:16px}.tablewrap{overflow:auto}.reqtable{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:900px}.reqtable th{padding:6px 10px;text-align:right;font-size:12px;color:#64748b}.reqtable td{background:#fff;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:12px 10px;font-size:13px;vertical-align:middle}.reqtable td:first-child{border-right:1px solid #e2e8f0;border-radius:0 12px 12px 0}.reqtable td:last-child{border-left:1px solid #e2e8f0;border-radius:12px 0 0 12px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.s-pending{background:#fef3c7;color:#92400e}.s-return{background:#dbeafe;color:#1d4ed8}.s-reject{background:#fee2e2;color:#991b1b}.s-approved{background:#dcfce7;color:#166534}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:8px 10px;font-family:inherit;font-weight:800;cursor:pointer}.approve{background:#dcfce7;color:#166534}.return{background:#fef3c7;color:#92400e}.reject{background:#fee2e2;color:#991b1b}.view{background:#eef2ff;color:#3730a3}.notice{background:#eff6ff;border:1px solid #bfdbfe;padding:11px;border-radius:12px;color:#1e3a8a;font-size:12px;margin:8px 0}.msg{min-height:22px;margin-top:10px;color:#b91c1c;font-weight:800}.empty{text-align:center;padding:34px 12px;color:#64748b}.empty b{display:block;color:#334155;font-size:16px;margin-bottom:5px}.modal{display:none;position:fixed;inset:0;background:#0f172a80;z-index:1000;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 30px 90px #0004}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}.close{border:0;background:#f1f5f9;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:900}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:11px}.field label{font-size:12px;font-weight:900;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:10px;font-family:inherit;background:#fff}.field textarea{min-height:92px;resize:vertical}.span2{grid-column:1/-1}.dynamic{display:none}.dynamic.on{display:block}.history{border-right:3px solid #cbd5e1;padding-right:14px}.historyitem{padding:8px 0;border-bottom:1px dashed #e2e8f0}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detailcell{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}.detailcell b{display:block;font-size:11px;color:#64748b;margin-bottom:4px}.attachment{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:#0f766e;font-weight:800}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:#0f766e;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.detailgrid{grid-template-columns:1fr}.span2{grid-column:auto}.wrap{padding:14px}.head{padding:20px}.back{position:static;display:inline-block;margin-bottom:10px}}
</style></head><body><div class="wrap">
<header class="head"><a class="back" href="javascript:history.back()">عودة</a><h1>مركز طلبات حالات الانضباط</h1><div class="sub">إنشاء الطلب، متابعة حالته، والمصادقة والاعتماد وفق التسلسل التنظيمي للمدرسة.</div><div class="profile"><span class="chip" id="schoolChip">المدرسة…</span><span class="chip" id="userChip">المستخدم…</span><span class="chip" id="roleChip">الدور…</span></div></header>
<section class="grid" id="metrics"></section>
<div class="toolbar"><div class="tabs"><button id="myTab" onclick="show('my')">طلباتي</button><button id="queueTab" onclick="show('queue')">بانتظار إجراءي</button><button id="processedTab" onclick="show('processed')">تمت معالجتها</button><button id="allTab" onclick="show('all')">جميع الطلبات</button><button id="perfTab" onclick="show('performance')">تقارير الأداء</button></div><button id="newRequestBtn" class="primary big" onclick="openRequestModal()">＋ طلب جديد</button></div>
<section class="panel"><div id="content"><span class="spinner"></span> جارٍ التحميل…</div><div class="msg" id="msg"></div></section>
</div>
<div class="modal" id="requestModal"><div class="modalbox"><div class="modalhead"><h2 id="requestModalTitle">طلب جديد</h2><button class="close" onclick="closeRequestModal()">إغلاق</button></div><div id="requestNotice"></div><div class="formgrid">
<div class="field"><label>نوع الطلب</label><select id="reqType" onchange="renderTypeFields()"><option value="">اختر نوع الطلب</option><option value="absence">غياب</option><option value="permission">استئذان</option><option value="leave">إجازة</option><option value="deputation">انتداب</option><option value="training">دورة تدريبية</option></select></div>
<div class="field dynamic" data-for="leave"><label>نوع الإجازة</label><select id="leaveType"><option value="مرضية">مرضية</option><option value="اضطرارية">اضطرارية</option><option value="اعتيادية">اعتيادية</option><option value="مرافقة">مرافقة</option><option value="وضع">وضع</option><option value="أمومة">أمومة</option><option value="وفاة">وفاة</option><option value="زواج">زواج</option><option value="أخرى">أخرى</option></select></div>
<div class="field"><label>من تاريخ</label><input id="reqStart" type="date"></div><div class="field"><label>إلى تاريخ</label><input id="reqEnd" type="date"></div>
<div class="field dynamic" data-for="permission"><label>وقت الخروج</label><input id="permissionStartTime" type="time"></div><div class="field dynamic" data-for="permission"><label>وقت العودة</label><input id="permissionEndTime" type="time"></div>
<div class="field dynamic" data-for="deputation"><label>جهة الانتداب</label><input id="deputationOrganization" placeholder="اسم الجهة"></div><div class="field dynamic" data-for="deputation"><label>مكان الانتداب</label><input id="deputationLocation" placeholder="المدينة / الموقع"></div>
<div class="field dynamic" data-for="training"><label>اسم الدورة</label><input id="trainingName" placeholder="اسم البرنامج أو الدورة"></div><div class="field dynamic" data-for="training"><label>الجهة المنفذة</label><input id="trainingOrganization" placeholder="الجهة المنفذة"></div><div class="field dynamic" data-for="training"><label>مكان الدورة</label><input id="trainingLocation" placeholder="حضوري / عن بعد / الموقع"></div>
<div class="field span2"><label>السبب / الملاحظات</label><textarea id="reqReason" placeholder="اكتب سبب الطلب أو أي ملاحظات مهمة"></textarea></div><div class="field span2"><label>مرفق داعم (اختياري)</label><input id="reqAttachment" type="file" accept="image/*,.pdf,.doc,.docx"><div class="muted" id="attachmentHint">يمكن إرفاق صورة أو PDF أو Word.</div></div>
</div><div class="actions" style="margin-top:16px"><button class="primary" id="submitRequestBtn" onclick="submitRequest()">إرسال الطلب</button><button class="ghost" onclick="closeRequestModal()">إلغاء</button></div></div></div>
<script src="private-workflows.js"></script></body></html>
