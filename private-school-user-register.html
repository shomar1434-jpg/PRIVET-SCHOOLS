<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل مستخدم المدرسة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f8;font-family:Tajawal,Arial;color:#17324d;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:#fff;border:1px solid #dce7ed;border-radius:24px;padding:26px;box-shadow:0 18px 50px #17324d1c}h1{margin:0 0 6px;color:#0b3d2f}.muted{color:#64748b;font-size:13px}.school{background:#edf9f3;border:1px solid #cceadd;border-radius:16px;padding:14px;margin:16px 0;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:900}input,select{width:100%;padding:12px;border:1px solid #cfdce4;border-radius:12px;font-family:inherit;background:#fff}button{width:100%;padding:13px;border:0;border-radius:12px;background:#0f6b4a;color:#fff;font-family:inherit;font-weight:900;cursor:pointer;margin-top:14px}.msg{margin-top:12px;font-size:13px;font-weight:800}.ok{color:#087443}.err{color:#b42318}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>تسجيل مستخدم جديد</h1><div class="muted">التسجيل من رابط المدرسة لا يفعّل الحساب مباشرة. يظهر الطلب لمدير المدرسة لاعتماده وتفعيله.</div><div id="school" class="school">جارٍ التحقق من رابط المدرسة...</div><form id="form" hidden><div class="grid"><div class="field full"><label>الاسم الكامل</label><input id="name" required></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="8" required></div><div class="field full"><label>الدور الوظيفي</label><select id="role" required><option value="">اختر الدور</option><option value="agent">وكيل/وكيلة</option><option value="teacher">معلم/معلمة</option><option value="student_advisor">موجه/موجهة طلابية</option><option value="health_advisor">موجه صحي</option><option value="activity_leader">رائد/رائدة نشاط</option><option value="kindergarten_teacher">معلمة رياض أطفال</option><option value="administrative_employee">موظف إداري</option></select></div></div><button id="submit" type="submit">إرسال طلب التسجيل</button><div id="msg" class="msg"></div></form></main><script>
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';let reg=null;const map={registration_link_not_found:'رابط التسجيل غير صحيح.',registration_link_disabled:'تم إيقاف رابط التسجيل.',registration_link_expired:'انتهت صلاحية رابط التسجيل.',email_belongs_to_another_school:'هذا البريد مرتبط بمدرسة أخرى.',already_registered_in_school:'هذا البريد مسجل في المدرسة بالفعل.',email_reserved:'هذا البريد غير متاح للتسجيل.',invalid_registration_input:'تحقق من جميع البيانات وكلمة المرور.'};
async function init(){try{reg=await PrivateSchoolBridge.inspectSchoolRegistration(token);$('school').textContent='المدرسة: '+(reg.school?.school_name||'');$('form').hidden=false}catch(e){$('school').textContent=map[e.message]||e.message||'تعذر التحقق من الرابط';$('school').style.color='#b42318'}}
$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;$('msg').className='msg';$('msg').textContent='جارٍ تسجيل الطلب...';try{await PrivateSchoolBridge.registerSchoolUser({token,fullName:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value,role:$('role').value});$('msg').className='msg ok';$('msg').textContent='تم تسجيل الحساب بنجاح وهو الآن بانتظار تفعيل مدير المدرسة.';e.target.reset();b.style.display='none'}catch(x){$('msg').className='msg err';$('msg').textContent=map[x.message]||x.message||'تعذر التسجيل';b.disabled=false}};init();
</script></body></html>
