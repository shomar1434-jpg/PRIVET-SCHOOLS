<!doctype html><html lang="ar" dir="rtl"><head>
<script src="private-auth-storage.js"></script><script src="private-storage-namespace.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المدرسة الأهلية والخاصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#082f49,#0f766e);font-family:Tajawal,Arial,sans-serif}.card{width:min(94vw,450px);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 70px #0004;text-align:center}.icon{font-size:48px}h1{color:#15445a;margin:10px 0 5px}.sub{color:#64748b;font-size:13px;line-height:1.7}.field{margin:12px 0}.field input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;text-align:center}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#0f766e;color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{min-height:22px;margin-top:11px;color:#b42318;font-size:13px}</style></head><body><main class="card"><div class="icon">🏫</div><h1>بوابة دخول مستخدمي المدرسة</h1><p class="sub">تعمل للحسابات التي تم تسجيلها من رابط المدرسة ثم تفعيلها من المدير.</p><form id="loginForm"><div class="field"><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني" required></div><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required></div><button class="btn">دخول</button><div id="msg" class="msg"></div></form></main><script>const sid=new URLSearchParams(location.search).get('schoolId')||new URLSearchParams(location.search).get('school_id')||'';document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='جارٍ التحقق...';try{const requestedRole=new URLSearchParams(location.search).get('role')||'';const r=await PrivateSchoolBridge.login(document.getElementById('email').value,document.getElementById('password').value,sid,requestedRole);const ctx=r.context;const target=PrivateSchoolBridge.roleLanding(ctx);location.replace(target+(target.includes('?')?'&':'?')+'privateEdition=1&schoolId='+encodeURIComponent(ctx.schoolId))}catch(err){try{await PrivateSchoolBridge.logout()}catch(_){}const raw=String(err.message||'');m.textContent=raw.includes('no_active_membership')?'الحساب غير مفعل بعد أو لا ينتمي إلى هذه المدرسة.':(raw||'تعذر تسجيل الدخول')}};</script></body></html>
