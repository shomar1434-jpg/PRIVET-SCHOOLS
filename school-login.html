<!doctype html><html lang="ar" dir="rtl"><head>
<script src="private-auth-storage.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المدرسة الأهلية والخاصة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="private-school-bridge.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#082f49,#0f766e);font-family:Tajawal,Arial,sans-serif}.card{width:min(94vw,460px);background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 70px #0004;text-align:center}.icon{font-size:48px}h1{color:#15445a;margin:10px 0 5px}.sub{color:#64748b;font-size:13px;line-height:1.8}.field{margin:12px 0}.field input,.field select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;text-align:center;background:#fff}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#0f766e;color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{min-height:22px;margin-top:11px;color:#b42318;font-size:13px}.school{font-weight:900;color:#0f766e}.hidden{display:none}</style></head><body>
<main class="card"><div class="icon">🏫</div><h1>بوابة دخول المدرسة</h1><p class="sub">رابط واحد للمدير وجميع المستخدمين المسجلين والمفعّلين في هذه المدرسة.</p><div id="schoolLabel" class="school"></div>
<form id="loginForm"><div class="field"><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني" required></div><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required></div><button class="btn">دخول</button><div id="msg" class="msg"></div></form>
<div id="roleBox" class="hidden"><p class="sub">لديك أكثر من دور فعال في هذه المدرسة. اختر مساحة العمل:</p><div class="field"><select id="roleSelect"></select></div><button id="continueRole" class="btn" type="button">متابعة</button></div></main>
<script>
const q=new URLSearchParams(location.search),sid=q.get('schoolId')||q.get('school_id')||'';const msg=document.getElementById('msg'),form=document.getElementById('loginForm'),roleBox=document.getElementById('roleBox');
if(!sid){msg.textContent='رابط المدرسة غير مكتمل: لا يوجد schoolId.'}
const labels={manager:'مدير/مديرة المدرسة',agent:'وكيل/وكيلة',teacher:'معلم/معلمة',student_advisor:'موجه/موجهة طلابية',activity_leader:'رائد/رائدة نشاط',kindergarten_teacher:'معلمة رياض أطفال',health_advisor:'موجه/موجهة صحي',administrative_employee:'موظف/موظفة إدارية'};
function openCtx(ctx){const target=PrivateSchoolBridge.roleLanding(ctx);const u=new URL(target,location.href);u.searchParams.set('privateEdition','1');u.searchParams.set('schoolId',ctx.schoolId);location.replace(u.href)}
form.onsubmit=async e=>{e.preventDefault();if(!sid){msg.textContent='رابط المدرسة غير صحيح.';return}msg.textContent='جارٍ التحقق من الحساب والعضوية...';try{const r=await PrivateSchoolBridge.login(email.value,password.value,sid,'');const ctx=r.context;const roles=Array.isArray(ctx.availableRoles)?ctx.availableRoles.filter(x=>x!=='owner'):[];if(roles.length>1){form.classList.add('hidden');roleBox.classList.remove('hidden');roleSelect.innerHTML=roles.map(x=>'<option value="'+x+'">'+(labels[x]||x)+'</option>').join('');continueRole.onclick=async()=>{msg.textContent='جارٍ فتح مساحة العمل...';try{const rr=await PrivateSchoolBridge.establishContext(sid,roleSelect.value);openCtx(rr.context)}catch(er){msg.textContent=er.message||'تعذر فتح الدور'}};return}openCtx(ctx)}catch(err){const raw=String(err.message||'');msg.textContent=raw.includes('no_active_membership')?'الحساب غير مفعل أو لا ينتمي إلى هذه المدرسة.':(raw||'تعذر تسجيل الدخول')}};
</script></body></html>
