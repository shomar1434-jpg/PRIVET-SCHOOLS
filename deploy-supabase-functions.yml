name: Deploy Private Supabase Edge Functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/private-school-files/**'
      - '.github/workflows/deploy-supabase-functions.yml'
permissions:
  contents: read
jobs:
  deploy-private-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Validate private project
        env:
          PRIVATE_SUPABASE_PROJECT_REF: ${{ secrets.PRIVATE_SUPABASE_PROJECT_REF }}
        run: test "$PRIVATE_SUPABASE_PROJECT_REF" = 'okjwdzvnqsdetxdsvdgr'
      - name: Deploy private upload correction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRIVATE_SUPABASE_ACCESS_TOKEN }}
          PRIVATE_SUPABASE_PROJECT_REF: ${{ secrets.PRIVATE_SUPABASE_PROJECT_REF }}
        run: supabase functions deploy private-school-files --project-ref "$PRIVATE_SUPABASE_PROJECT_REF" --use-api
