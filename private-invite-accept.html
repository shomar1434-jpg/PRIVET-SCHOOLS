<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قبول دعوة المدرسة الخاصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Tahoma,Arial;color:#0f172a}.card{width:min(92vw,520px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0f172a1a}.meta{background:#f8fafc;padding:14px;border-radius:14px;line-height:1.9;font-size:14px}.field{margin-top:14px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:12px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#0f766e;color:white;font-weight:800}.msg{margin-top:12px;color:#b91c1c;min-height:22px}</style><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="private-school-theme.css"><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><main class="card"><h1>قبول دعوة الانضمام</h1><div id="meta" class="meta">جارٍ التحقق من الدعوة...</div><div id="form" hidden><div class="field"><input id="name" placeholder="الاسم الكامل"></div><div class="field"><input id="password" type="password" minlength="8" placeholder="كلمة مرور لا تقل عن 8 أحرف"></div><button id="accept">قبول الدعوة وإنشاء الحساب</button></div><div id="msg" class="msg"></div></main><script>const token=new URLSearchParams(location.search).get('token')||'';let invite=null;(async()=>{try{const r=await PrivateSchoolBridge.inspectInvite(token);invite=r.invitation;document.getElementById('meta').innerHTML=`<b>المدرسة:</b> ${invite.schoolName||''}<br><b>الدور:</b> ${invite.role||invite.invite_role||''}<br><b>البريد:</b> ${invite.email||invite.invitee_email||''}<br><b>الحالة:</b> ${invite.status}`;if(invite.status==='pending'){document.getElementById('form').hidden=false;document.getElementById('name').value=invite.name||invite.invitee_name||''}}catch(e){document.getElementById('meta').textContent='تعذر التحقق من الدعوة';document.getElementById('msg').textContent=e.message}})();document.getElementById('accept').onclick=async()=>{const m=document.getElementById('msg');m.textContent='';try{const r=await PrivateSchoolBridge.acceptInvite({token,fullName:document.getElementById('name').value,password:document.getElementById('password').value});if(r.pendingActivation||r.status==='pending'){document.getElementById('form').hidden=true;document.getElementById('meta').innerHTML='<b>تم قبول الدعوة بنجاح.</b><br>الحساب الآن بانتظار التفعيل من '+(r.supervisorRole==='agent'?'الوكيل/الوكيلة':'المدير/المديرة')+' الذي أرسل رابط التسجيل. لا يمكن الدخول قبل التفعيل.';m.style.color='#0f766e';m.textContent='سيتم فتح الحساب فور اعتماد المرسل.';return;}const login=r.role==='owner'?'private-owner-login.html':'school-login.html';location.href=login+'?edition=private&schoolId='+encodeURIComponent(r.schoolId)}catch(e){m.textContent=e.message||'تعذر قبول الدعوة'}};</script></body></html>
