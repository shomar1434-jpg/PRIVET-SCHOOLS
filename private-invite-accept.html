<!doctype html><html lang="ar" dir="rtl"><head><title>قبول دعوة المدرسة</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-supabase-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:linear-gradient(135deg,#0f172a,#164e63);color:#0f172a;min-height:100vh;direction:rtl}.wrap{width:min(1120px,94vw);margin:auto;padding:36px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:26px;box-shadow:0 24px 70px #02061755;padding:24px}.brand{color:#fff;text-align:center;margin-bottom:20px}.brand h1{font-size:32px;margin:0}.brand p{color:#cbd5e1}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.field{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:14px;font:inherit;background:#fff}.btn{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:#0f766e;color:#fff}.btn.secondary{background:#334155}.btn.danger{background:#b91c1c}.btn.light{background:#e2e8f0;color:#0f172a}.actions{display:flex;gap:9px;flex-wrap:wrap}.msg{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f1f5f9;display:none}.msg.show{display:block}.muted{color:#64748b;font-size:13px}.title{font-size:24px;font-weight:800;margin:0 0 6px}.section{margin-top:18px;padding-top:18px;border-top:1px solid #e2e8f0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}.table th{background:#f8fafc}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800}.module{border:1px solid #e2e8f0;border-radius:18px;padding:18px;background:#f8fafc}.module h3{margin:0 0 8px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="brand"><h1>نظام إدارة المدارس الذكي</h1><p>الانضمام إلى المدرسة</p></div><div class="card" style="max-width:620px;margin:auto"><h2 class="title">استكمال التسجيل</h2><div id="info" class="module">جاري فحص رابط الدعوة...</div><div id="form" class="grid section" style="display:none"><input id="fullName" class="field" placeholder="الاسم الكامل"><input id="password" type="password" class="field" placeholder="إنشاء كلمة مرور - 8 أحرف فأكثر"><button class="btn" onclick="acceptInvite()">إرسال طلب الانضمام</button></div><div id="msg" class="msg"></div></div></div><script>const token=PrivateSchool.params().get('token')||'';function show(t,b=false){msg.textContent=t;msg.className='msg show';msg.style.color=b?'#b91c1c':'#047857'}async function inspect(){try{const d=await PrivateSchool.invite('inspect',{token});info.innerHTML=`<b>${d.school?.school_name||''}</b><div class="muted">الدور: ${d.invitation?.invite_role||''} — ${d.invitation?.invitee_email||''}</div>`;fullName.value=d.invitation?.invitee_name||'';form.style.display='grid'}catch(e){info.textContent=e.message;info.style.color='#b91c1c'}}async function acceptInvite(){try{show('جاري إرسال الطلب...');await PrivateSchool.invite('accept',{token,password:password.value,fullName:fullName.value});form.style.display='none';show('تم التسجيل. الحساب بانتظار التفعيل من المسؤول المباشر.')}catch(e){show(e.message,true)}}inspect();</script></body></html>
