<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة المخرج المؤسسي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#e9eef2;font-family:Tajawal;color:#17263a}.toolbar{position:sticky;top:0;z-index:10;background:#0b3d2f;color:#fff;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-family:inherit;font-weight:900;cursor:pointer;background:#fff;color:#0b3d2f}.page{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:10mm;border:1px solid #cfd8df;box-shadow:0 10px 36px #0002}.head{display:grid;grid-template-columns:35mm 1fr 35mm;align-items:center;border:2px solid #0f6b4a;border-radius:14px;padding:7mm}.head img{width:28mm;height:25mm;object-fit:contain}.title{text-align:center}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8mm 0}.box{border:1px solid #d7e1e7;border-radius:10px;padding:8px}.req{width:100%;border-collapse:collapse}.req th,.req td{border:1px solid #dbe3e8;padding:7px;vertical-align:top}.req th{background:#eff8f4;color:#0b3d2f}.foot{margin-top:10mm;border-top:1px solid #dce3e7;padding-top:6mm;display:flex;justify-content:space-between;gap:20px}.muted{color:#64748b;font-size:12px}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;border:0;box-shadow:none;width:auto;min-height:auto;page-break-after:avoid}}</style><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="toolbar"><button class="btn" onclick="doPrint()">طباعة / حفظ PDF</button><input id="pdf" type="file" accept="application/pdf"><input id="pages" type="number" min="1" value="1" style="width:70px;padding:8px;border-radius:8px;border:0"><button class="btn" onclick="finalizePdf()">رفع واعتماد PDF النهائي</button><button class="btn" onclick="history.back()">رجوع</button><span id="msg"></span></div><main class="page" id="page"><div>جارٍ تحميل المخرج...</div></main><script>
let current=null;const id=new URLSearchParams(location.search).get('outputId')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderCompliance(o,t,school){const s=o.content_snapshot||{},ins=s.inspection||{},items=s.items||[],summary=s.summary||{};return `<section class="head"><div>${t.ministry_logoUrl?`<img src="${t.ministry_logoUrl}">`:''}</div><div class="title"><b>${esc(t.kingdomName||'المملكة العربية السعودية')}</b><br>${esc(t.ministryName||'وزارة التعليم')}<h2>${esc(o.title)}</h2><div>${esc(t.schoolDisplayName||school.school_name||'')}</div></div><div>${t.school_logoUrl?`<img src="${t.school_logoUrl}">`:''}</div></section><div class="meta"><div class="box"><b>العام الدراسي</b><br>${ins.academic_year||o.academic_year||'-'}هـ</div><div class="box"><b>حالة الفحص</b><br>${ins.status==='completed'?'مكتمل ومقفل':esc(ins.status||'')}</div><div class="box"><b>المتطلبات المكتملة</b><br>${summary.completed||0} من ${summary.total||items.length}</div><div class="box"><b>عدد الشواهد</b><br>${summary.evidenceCount||0}</div></div><table class="req"><thead><tr><th>#</th><th>المتطلب</th><th>الحالة</th></tr></thead><tbody>${items.map(x=>`<tr><td>${x.requirement_order}</td><td>${esc(x.item_title)}${x.requirement_note?`<div class="muted">${esc(x.requirement_note)}</div>`:''}</td><td>${x.fulfillment_status==='complete'?'مكتمل':x.fulfillment_status==='not_applicable'?'لا ينطبق':'بانتظار شاهد'}</td></tr>`).join('')}</tbody></table><footer class="foot"><div><b>مالك المدرسة</b><br>${esc(t.ownerDisplayName||'')} ${t.owner_signatureUrl?`<div><img src="${t.owner_signatureUrl}" style="max-width:34mm;max-height:15mm;object-fit:contain"></div>`:''}</div><div><b>مدير المدرسة</b><br>${esc(t.managerDisplayName||'')} ${t.manager_signatureUrl?`<div><img src="${t.manager_signatureUrl}" style="max-width:34mm;max-height:15mm;object-fit:contain"></div>`:''}</div><div>${t.digital_stampUrl?`<img src="${t.digital_stampUrl}" style="max-width:24mm;max-height:24mm;object-fit:contain">`:''}</div></footer>`}
async function init(){try{const r=await PrivateSchoolBridge.outputs('preview',{outputId:id});current=r.output;const t=r.template||{};page.innerHTML=current.source_module==='private_school_compliance'?renderCompliance(current,t,r.school):`<h1>${esc(current.title)}</h1><pre style="white-space:pre-wrap">${esc(JSON.stringify(current.content_snapshot,null,2))}</pre>`;if(current.status==='finalized')msg.textContent='هذا المخرج معتمد نهائيًا.'}catch(e){page.innerHTML='<b>'+esc(e.message)+'</b>'}}async function doPrint(){try{await PrivateSchoolBridge.outputs('markPrinted',{outputId:id})}catch(_){}window.print()}async function finalizePdf(){const file=pdf.files?.[0];if(!file)return alert('اختر ملف PDF الذي حفظته من المعاينة.');if(file.type!=='application/pdf')return alert('يجب أن يكون الملف بصيغة PDF.');try{msg.textContent='جارٍ رفع الملف النهائي...';const up=await PrivateSchoolBridge.uploadModuleFile({moduleKey:'private_school_outputs',file,slotKey:id,recordType:'private_output',recordId:id,displayName:file.name});await PrivateSchoolBridge.outputs('finalize',{outputId:id,fileId:up.file.id,pageCount:Number(pages.value)||1});msg.textContent='تم اعتماد المخرج النهائي وأرشفته.';pdf.disabled=true}catch(e){msg.textContent=e.message}}init();</script></body></html>
