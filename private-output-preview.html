*{box-sizing:border-box}body{margin:0;background:#e9eef2;font-family:Tajawal,Arial;color:#17263a}.toolbar{position:sticky;top:0;z-index:20;background:#0b3d2f;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-family:inherit;font-weight:900;cursor:pointer;background:#fff;color:#0b3d2f}.btn.primary{background:#18a06b;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.doc{width:210mm;margin:16px auto}.sheet{width:210mm;height:297mm;min-height:297mm;max-height:297mm;background:#fff;padding:8mm 9mm 7mm;margin:0 auto 12px;border:1px solid #cfd8df;box-shadow:0 10px 36px #0002;display:flex;flex-direction:column;overflow:hidden;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid;position:relative}.sheet:last-child{break-after:auto;page-break-after:auto}.head{display:grid;grid-template-columns:30mm 1fr 30mm;align-items:center;border-bottom:2px solid #0f6b4a;padding-bottom:4mm;min-height:30mm}.head img{max-width:27mm;max-height:22mm;object-fit:contain}.center{text-align:center}.school{font-weight:800;font-size:13px}.req-title{margin:5mm 0 3mm;background:#eff8f4;border:1px solid #cce7da;border-radius:12px;padding:4mm 5mm;text-align:center;color:#0b3d2f}.req-title h2{margin:0;font-size:20px}.req-title small{display:block;margin-top:3px;color:#5d6c76;font-size:11px}.evidence-frame{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;border:1px solid #e0e8ed;border-radius:12px;padding:4mm;overflow:hidden;background:#fff;text-align:center}.evidence-frame img,.evidence-frame canvas{display:block!important;max-width:100%!important;max-height:100%!important;width:auto!important;height:auto!important;object-fit:contain!important;margin:auto!important;align-self:center!important;justify-self:center!important}.na{font-size:20px;font-weight:900;color:#64748b;text-align:center}.na small{display:block;font-size:13px;font-weight:500;margin-top:10px}.foot{height:30mm;margin-top:4mm;border-top:1px solid #dce3e7;padding-top:3mm;display:grid;grid-template-columns:1fr 34mm 1fr;gap:8mm;align-items:start;font-size:11px}.sign{text-align:center}.sign b{display:block;margin-bottom:2px}.sign img{max-width:35mm;max-height:14mm;object-fit:contain}.stamp{text-align:center}.stamp img{max-width:24mm;max-height:24mm;object-fit:contain}.contact{text-align:center;color:#65727b;font-size:9px;margin-top:auto;padding-top:2mm}.loading{width:210mm;min-height:120mm;margin:20px auto;background:#fff;border-radius:16px;display:grid;place-items:center;font-weight:900;color:#0b3d2f}.error{color:#b42318}.muted{font-size:12px;color:#d6eee4}.page-no{font-size:10px;color:#65727b;text-align:left;margin-top:2px}
@media(max-width:900px){.doc,.loading{width:100%;margin:0}.sheet{width:100%;height:auto;min-height:297mm;padding:16px}.toolbar{position:relative}.head{grid-template-columns:70px 1fr 70px}}

</style><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body>
<div class="toolbar"><button id="makePdf" class="btn primary" disabled>إنشاء واعتماد PDF النهائي</button><button class="btn" onclick="window.print()">طباعة المعاينة</button><button class="btn" onclick="history.back()">رجوع</button><a id="finalLink" class="btn" target="_blank" rel="noopener" style="display:none;text-decoration:none">فتح PDF المعتمد</a><span id="msg" class="muted"></span></div>
<div id="loading" class="loading">جارٍ إعداد صفحات ملف فحص الالتزام...</div><main id="doc" class="doc" hidden></main>
<script type="module">
const id=new URLSearchParams(location.search).get('outputId')||'';let current=null,preview=null,pdfjsLib=null;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{pdfjsLib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs'}catch(e){console.error(e)}
function evidenceFor(itemId){return (current?.content_snapshot?.evidence||[]).filter(e=>String(e.item_id)===String(itemId))}
function pageShell(item,t,school,body,label=''){const phone=t.schoolPhone||t.school_phone||'',email=t.schoolEmail||t.school_email||'',address=t.schoolAddress||t.school_address||'',contact=t.contactFooter||t.contact_footer||[phone,email,address].filter(Boolean).join(' • ');return `<section class="sheet"><header class="head"><div>${t.ministry_logoUrl?`<img src="${esc(t.ministry_logoUrl)}" crossorigin="anonymous">`:''}</div><div class="center"><div>المملكة العربية السعودية</div><div>وزارة التعليم</div><div class="school">${esc(t.schoolDisplayName||school.school_name||'')}</div></div><div class="center">${t.school_logoUrl?`<img src="${esc(t.school_logoUrl)}" crossorigin="anonymous">`:''}</div></header><div class="req-title"><h2>${esc(item.requirement_order+'. '+item.item_title)}</h2><small>${esc(item.requirement_note||'')}${label?' • '+esc(label):''}</small></div><div class="evidence-frame">${body}</div><footer class="foot"><div class="sign"><b>مالك المدرسة</b><span>${esc(t.ownerDisplayName||'')}</span>${t.owner_signatureUrl?`<div><img src="${esc(t.owner_signatureUrl)}" crossorigin="anonymous"></div>`:''}</div><div class="stamp">${t.digital_stampUrl?`<img src="${esc(t.digital_stampUrl)}" crossorigin="anonymous">`:''}</div><div class="sign"><b>مدير/مديرة المدرسة</b><span>${esc(t.managerDisplayName||'')}</span>${t.manager_signatureUrl?`<div><img src="${esc(t.manager_signatureUrl)}" crossorigin="anonymous"></div>`:''}</div></footer><div class="contact">${esc(contact||'')}</div></section>`}
async function renderPdfEvidence(ev,item,t,school){if(!pdfjsLib)throw new Error('تعذر تحميل محرك قراءة PDF');const buf=await fetch(ev.signed_url).then(r=>{if(!r.ok)throw new Error('تعذر فتح شاهد PDF');return r.arrayBuffer()});const pdf=await pdfjsLib.getDocument({data:buf}).promise;const pages=[];for(let i=1;i<=pdf.numPages;i++){const holder=document.createElement('div');holder.innerHTML=pageShell(item,t,school,'<div class="pdf-slot" data-pdf-page="'+i+'"></div>',`الشاهد: ${ev.file_name||'PDF'} — صفحة ${i} من ${pdf.numPages}`);const sheet=holder.firstElementChild;const slot=sheet.querySelector('.pdf-slot');const page=await pdf.getPage(i);const vp=page.getViewport({scale:1.55});const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;slot.replaceWith(canvas);pages.push(sheet)}return pages}
async function buildPages(r){current=r.output;preview=r;const t=r.template||{},school=r.school||{},s=current.content_snapshot||{},items=s.items||[];const doc=$('doc');doc.innerHTML='';let count=0;for(const item of items){const evs=evidenceFor(item.id);for(const ev of evs){const mime=String(ev.mime_type||'').toLowerCase();if(mime==='application/pdf'){const pages=await renderPdfEvidence(ev,item,t,school);pages.forEach(p=>doc.append(p));count+=pages.length}else if(mime.startsWith('image/')){const holder=document.createElement('div');holder.innerHTML=pageShell(item,t,school,`<img src="${esc(ev.signed_url)}" crossorigin="anonymous" alt="${esc(ev.file_name||'شاهد')}">`,`الشاهد: ${ev.file_name||'صورة'}`);doc.append(holder.firstElementChild);count++}}}
 [...doc.querySelectorAll('.sheet')].forEach((p,i)=>{const n=document.createElement('div');n.className='page-no';n.textContent=`صفحة ${i+1} من ${count}`;p.append(n)});return count}
async function init(){try{if(!id)throw new Error('معرف المخرج غير موجود');const r=await PrivateSchoolBridge.outputs('preview',{outputId:id});if(r.output.source_module!=='private_school_compliance'&&r.output.output_type!=='compliance_file')throw new Error('هذه الصفحة مخصصة لملف فحص الالتزام');const count=await buildPages(r);$('loading').hidden=true;$('doc').hidden=false;$('makePdf').disabled=!count;if(r.output.status==='finalized'&&r.output.final_file_url){$('finalLink').href=r.output.final_file_url;$('finalLink').style.display='inline-block';$('msg').textContent=`PDF معتمد • ${r.output.generated_page_count||count} صفحة`;}}catch(e){$('loading').innerHTML='<span class="error">'+esc(e.message||'تعذر إعداد الملف')+'</span>'}}
async function createFinalPdf(){const btn=$('makePdf');if(btn.disabled)return;try{btn.disabled=true;$('msg').textContent='جارٍ إنشاء ملف PDF متعدد الصفحات...';await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res})));if(!window.html2canvas||!window.jspdf?.jsPDF)throw new Error('تعذر تحميل محرك PDF الصارم');const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});const sheets=[...document.querySelectorAll('.sheet')];if(!sheets.length)throw new Error('لا توجد صفحات لإنشاء الملف');for(let i=0;i<sheets.length;i++){const sheet=sheets[i];const canvas=await window.html2canvas(sheet,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0});const img=canvas.toDataURL('image/jpeg',0.97);if(i>0)pdf.addPage('a4','portrait');pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST')}const blob=pdf.output('blob');const filename=`فحص_الالتزام_${(preview?.school?.school_name||'المدرسة').replace(/\s+/g,'_')}_${current.academic_year||''}.pdf`;const file=new File([blob],filename,{type:'application/pdf'});$('msg').textContent='جارٍ رفع واعتماد PDF النهائي...';const up=await PrivateSchoolBridge.uploadModuleFile({moduleKey:'private_school_outputs',file,slotKey:id,recordType:'compliance_output',recordId:id,displayName:file.name});const pageCount=sheets.length;await PrivateSchoolBridge.outputs('finalize',{outputId:id,fileId:up.file.id,pageCount});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);$('msg').textContent=`تم إنشاء واعتماد ملف فحص الالتزام — ${pageCount} صفحة.`;const fresh=await PrivateSchoolBridge.outputs('preview',{outputId:id});if(fresh.output.final_file_url){$('finalLink').href=fresh.output.final_file_url;$('finalLink').style.display='inline-block'}}catch(e){$('msg').textContent=e.message||'تعذر إنشاء PDF';btn.disabled=false}}
$('makePdf').onclick=createFinalPdf;init();
</script></body></html>
