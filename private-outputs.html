<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أرشيف المخرجات المؤسسية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fb;font-family:Tajawal;color:#17263a}.wrap{max-width:1150px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#0b3d2f,#1b8a61);color:#fff;padding:22px;border-radius:26px}.card{background:#fff;border:1px solid #dce8ef;border-radius:18px;padding:15px;margin-top:12px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 13px;font-family:inherit;font-weight:900;cursor:pointer;background:#0f6b4a;color:#fff;text-decoration:none}.tag{padding:5px 9px;border-radius:999px;background:#eef5f2;color:#0b3d2f;font-size:12px;font-weight:900}.muted{color:#64748b;font-size:13px}</style><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="wrap"><header class="hero"><h1 style="margin:0">أرشيف المخرجات المؤسسية</h1><p id="school"></p></header><div id="list"></div></div><script>async function init(){try{const c=await PrivateSchoolBridge.requireContext(['owner','manager']);school.textContent=c.schoolName;const r=await PrivateSchoolBridge.outputs('list');list.innerHTML=(r.outputs||[]).map(x=>`<article class="card"><div><b>${x.title}</b><div class="muted">${x.source_module||''} • ${x.academic_year?x.academic_year+'هـ':''} • ${new Date(x.created_at).toLocaleString('ar-SA')}</div></div><div><span class="tag">${x.status==='finalized'?'معتمد نهائيًا':'جاهز للمعاينة'}</span> <a class="btn" href="private-output-preview.html?privateEdition=1&outputId=${encodeURIComponent(x.id)}">فتح</a></div></article>`).join('')||'<div class="card">لا توجد مخرجات مؤسسية محفوظة حتى الآن.</div>'}catch(e){alert(e.message)}}init();</script></body></html>
