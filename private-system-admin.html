<!doctype html><html lang="ar" dir="rtl"><head><title>مدير النظام - المدارس الخاصة</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-supabase-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:linear-gradient(135deg,#0f172a,#164e63);color:#0f172a;min-height:100vh;direction:rtl}.wrap{width:min(1120px,94vw);margin:auto;padding:36px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:26px;box-shadow:0 24px 70px #02061755;padding:24px}.brand{color:#fff;text-align:center;margin-bottom:20px}.brand h1{font-size:32px;margin:0}.brand p{color:#cbd5e1}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.field{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:14px;font:inherit;background:#fff}.btn{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:#0f766e;color:#fff}.btn.secondary{background:#334155}.btn.danger{background:#b91c1c}.btn.light{background:#e2e8f0;color:#0f172a}.actions{display:flex;gap:9px;flex-wrap:wrap}.msg{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f1f5f9;display:none}.msg.show{display:block}.muted{color:#64748b;font-size:13px}.title{font-size:24px;font-weight:800;margin:0 0 6px}.section{margin-top:18px;padding-top:18px;border-top:1px solid #e2e8f0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}.table th{background:#f8fafc}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800}.module{border:1px solid #e2e8f0;border-radius:18px;padding:18px;background:#f8fafc}.module h3{margin:0 0 8px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="brand"><h1>نظام إدارة المدارس الذكي</h1><p>إدارة المدارس الخاصة</p></div><div class="card"><div class="topbar"><div><h2 class="title">مدير النظام</h2><div class="muted">إنشاء المدرسة والمالك ومتابعة حالة الحسابات</div></div><button class="btn secondary" onclick="logout()">خروج</button></div><div id="loginBox" class="grid g2"><input id="adminEmail" class="field" type="email" placeholder="البريد الإلكتروني"><input id="adminPassword" class="field" type="password" placeholder="كلمة المرور"><button class="btn" onclick="adminLogin()">دخول مدير النظام</button></div><div id="panel" style="display:none"><div class="section"><h3>إنشاء مدرسة خاصة ومالك رئيسي</h3><div class="grid g2"><input id="schoolName" class="field" placeholder="اسم المدرسة"><input id="ownerName" class="field" placeholder="اسم المالك"><input id="ownerEmail" class="field" type="email" placeholder="بريد المالك"><input id="ownerPassword" class="field" type="password" placeholder="كلمة مرور مؤقتة - 8 أحرف فأكثر"></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="createSchool()">إنشاء وربط المدرسة بالمالك</button></div></div><div class="section"><div class="topbar"><h3>المدارس الخاصة</h3><button class="btn light" onclick="loadSchools()">تحديث</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>المدرسة</th><th>الحالة</th><th>المالك</th><th>الدخول</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="msg" class="msg"></div></div></div><script>const msg=document.getElementById('msg');function show(t,b=false){msg.textContent=t;msg.className='msg show';msg.style.color=b?'#b91c1c':'#047857'}async function verified(){try{await PrivateSchool.systemAdmin('verify');loginBox.style.display='none';panel.style.display='block';await loadSchools();return true}catch(e){return false}}async function adminLogin(){try{show('جاري التحقق...');await PrivateSchool.signIn(adminEmail.value,adminPassword.value);await PrivateSchool.systemAdmin('verify');loginBox.style.display='none';panel.style.display='block';show('تم تسجيل دخول مدير النظام');await loadSchools()}catch(e){show(e.message,true)}}async function createSchool(){try{show('جاري إنشاء المدرسة والمالك...');const d=await PrivateSchool.provisionSchool({schoolName:schoolName.value,ownerName:ownerName.value,ownerEmail:ownerEmail.value,password:ownerPassword.value});show('تم إنشاء المدرسة وربط المالك بنجاح');schoolName.value=ownerName.value=ownerEmail.value=ownerPassword.value='';await loadSchools()}catch(e){show(e.message,true)}}async function loadSchools(){try{const d=await PrivateSchool.systemAdmin('list_schools');rows.innerHTML=(d.schools||[]).map(s=>`<tr><td><b>${s.school_name||''}</b><div class="muted">${s.school_code||''}</div></td><td><span class="pill">${s.status||''}</span></td><td>${s.owner?.name||s.owner?.email||'—'}</td><td>${s.ownerLoginPath?`<a class="btn" style="padding:7px 10px;text-decoration:none" href="${s.ownerLoginPath}">دخول المالك</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد مدارس بعد</td></tr>'}catch(e){show(e.message,true)}}async function logout(){await PrivateSchool.signOut({to:'private-entry.html'})}verified();</script></body></html>
