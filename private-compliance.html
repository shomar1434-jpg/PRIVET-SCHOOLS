<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص الالتزام — المدارس الأهلية والخاصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}:root{--g:#0f6b4a;--d:#0b3d2f;--t:#1b8a61;--line:#dce8ef;--muted:#64748b;--bg:#f4f8fb;--red:#b42318;--amber:#b7791f}body{margin:0;background:var(--bg);font-family:Tajawal,Arial;color:#17263a}.wrap{max-width:1180px;margin:auto;padding:22px}.head{padding:22px;background:linear-gradient(135deg,var(--d),var(--t));color:#fff;border-radius:26px;box-shadow:0 14px 38px #0b3d2f30;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.head h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:12px;padding:10px 14px;font-family:inherit;font-weight:900;cursor:pointer}.btn.white{background:#fff;color:var(--d)}.btn.green{background:var(--g);color:#fff}.btn.soft{background:#eff8f4;color:var(--d);border:1px solid #cae4d8}.btn.amber{background:#fff7db;color:#8a5a00}.btn.red{background:#fff0f0;color:var(--red)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px;box-shadow:0 8px 24px #0001}.bar{height:11px;background:#e8eef2;border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--g),#20a46e)}.muted{color:var(--muted);font-size:13px}.listBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{border:1px solid #e6edf1;border-radius:18px;padding:15px;margin:12px 0;background:#fcfefd}.itemTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.pending{background:#fff7db;color:#8a5a00}.complete{background:#e9fbf1;color:#087443}.evidence{margin-top:10px;padding-top:10px;border-top:1px dashed #d6e0e6}.evRow{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f7fafc;border-radius:12px;padding:8px 10px;margin:6px 0}.upload{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.upload input{max-width:330px}.summaryGrid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:16px;padding:12px;background:#f9fbfc}.metric b{font-size:23px;color:var(--g)}select{padding:10px;border-radius:12px;border:1px solid #ccd7df;font-family:inherit}.ownerOnly{background:#fff7e8;border-color:#f2d3a0}@media(max-width:700px){.summaryGrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}</style><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="wrap"><header class="head"><div><h1>فحص الالتزام للمدرسة الأهلية/الخاصة</h1><div id="school" style="margin-top:7px;color:#d8f3e7"></div></div><div class="actions"><a class="btn white" href="private-outputs.html?privateEdition=1" style="text-decoration:none">أرشيف المخرجات</a><button class="btn white" onclick="history.back()">رجوع</button></div></header><section class="card" id="chooser"><h2 style="margin-top:0">الفحوص السنوية</h2><div class="actions"><select id="year"></select><button class="btn green" onclick="createInspection()">إنشاء فحص جديد</button></div><div id="list" class="listBtns"></div></section><section class="card" id="inspection" hidden><div class="itemTop"><div><h2 id="ititle" style="margin:0"></h2><div id="istate" class="muted"></div></div><div class="actions"><button id="finalize" class="btn green" onclick="finalizeInspection()">إقفال وإنشاء المخرج النهائي</button></div></div><div id="metrics" class="summaryGrid" style="margin-top:14px"></div><div class="bar"><div id="fill" class="fill" style="width:0"></div></div><div id="items"></div></section></div><script>
let ctx,current=null;const y=document.getElementById('year');for(let i=1448;i<=1548;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'هـ';y.appendChild(o)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){try{ctx=await PrivateSchoolBridge.requireContext(['owner','manager']);document.getElementById('school').textContent=ctx.schoolName+' • '+(ctx.role==='owner'?'المالك':'مدير المدرسة');await refreshList()}catch(e){alert(e.message==='unsupported_evidence_type'?'يسمح برفع الصور أو ملفات PDF فقط.':e.message);location.href='school-login.html?edition=private'}}
async function refreshList(){const r=await PrivateSchoolBridge.compliance('list');document.getElementById('list').innerHTML=(r.inspections||[]).map(x=>`<button class="btn soft" onclick="openInspection('${x.id}')">${x.academic_year}هـ — ${x.status==='completed'?'مكتمل ومقفل':'قيد الاستكمال'}</button>`).join('')||'<span class="muted">لا يوجد فحص سابق.</span>'}
async function createInspection(){try{const r=await PrivateSchoolBridge.compliance('create',{academicYear:Number(y.value)});await openInspection(r.inspection.id);await refreshList()}catch(e){alert(e.message==='unsupported_evidence_type'?'يسمح برفع الصور أو ملفات PDF فقط.':e.message)}}
function evidenceFor(itemId){return (current?.evidence||[]).filter(e=>String(e.item_id)===String(itemId))}
function renderItem(x){const ev=evidenceFor(x.id);const ownerBlocked=x.owner_only&&ctx.role!=='owner';const status=x.fulfillment_status==='complete'?'complete':'pending';return `<article class="item ${x.owner_only?'ownerOnly':''}"><div class="itemTop"><div><b>${x.requirement_order}. ${esc(x.item_title)}</b>${x.owner_only?'<div class="muted">🔐 متطلب يعده ويرفعه المالك فقط</div>':''}<div class="muted">${esc(x.requirement_note||'')}</div></div><span class="tag ${status}">${status==='complete'?'مكتمل':'بانتظار شاهد'}</span></div><div class="evidence">${ev.length?ev.map(e=>`<div class="evRow"><span>📎 ${esc(e.file_name||'شاهد مرفوع')}</span>${!ownerBlocked&&current.inspection.status!=='completed'?`<span><button class="btn soft" onclick="replaceEvidence('${x.id}','${e.id}')">استبدال</button> <button class="btn red" onclick="removeEvidence('${e.id}')">إزالة</button></span>`:''}</div>`).join(''):'<div class="muted">لا توجد شواهد مرفوعة.</div>'}${!ownerBlocked&&current.inspection.status!=='completed'?`<div class="upload"><input type="file" id="file_${x.id}" accept="image/png,image/jpeg,image/webp,application/pdf"><button class="btn green" onclick="uploadEvidence('${x.id}')">إضافة صورة أو ملف PDF</button></div>`:''}</div></article>`}
async function openInspection(id){try{const r=await PrivateSchoolBridge.compliance('get',{inspectionId:id});current=r;document.getElementById('inspection').hidden=false;document.getElementById('ititle').textContent=r.inspection.title;document.getElementById('istate').textContent=r.inspection.status==='completed'?'تم إقفال الفحص ولا يمكن تعديل الشواهد.':'أكمل جميع المتطلبات الإلزامية قبل الإقفال.';document.getElementById('metrics').innerHTML=`<div class="metric">المتطلبات<br><b>${r.summary.total}</b></div><div class="metric">مكتمل<br><b>${r.summary.completed}</b></div><div class="metric">الشواهد<br><b>${r.summary.evidenceCount||0}</b></div><div class="metric">متبقٍ<br><b>${r.summary.pending}</b></div>`;document.getElementById('fill').style.width=r.summary.progress+'%';document.getElementById('items').innerHTML=(r.items||[]).map(renderItem).join('');const f=document.getElementById('finalize');f.disabled=r.inspection.status==='completed';f.style.display=r.inspection.status==='completed'?'none':''}catch(e){alert(e.message==='unsupported_evidence_type'?'يسمح برفع الصور أو ملفات PDF فقط.':e.message)}}
async function uploadEvidence(itemId){const input=document.getElementById('file_'+itemId),file=input?.files?.[0];if(!file)return alert('اختر ملف الشاهد أولًا.');if(!(file.type==='application/pdf'||file.type.startsWith('image/')))return alert('شواهد فحص الالتزام تقبل الصور أو ملفات PDF فقط.');try{const up=await PrivateSchoolBridge.uploadModuleFile({moduleKey:'private_school_compliance',file,slotKey:itemId,recordType:'compliance_requirement',recordId:itemId,displayName:file.name});await PrivateSchoolBridge.compliance('link_evidence',{inspectionId:current.inspection.id,itemId,fileId:up.file.id});input.value='';await openInspection(current.inspection.id)}catch(e){alert(e.message==='unsupported_evidence_type'?'يسمح برفع الصور أو ملفات PDF فقط.':e.message)}}
async function removeEvidence(id){if(!confirm('إزالة هذا الشاهد من المتطلب؟'))return;try{await PrivateSchoolBridge.compliance('remove_evidence',{evidenceId:id});await openInspection(current.inspection.id)}catch(e){alert(e.message==='unsupported_evidence_type'?'يسمح برفع الصور أو ملفات PDF فقط.':e.message)}}
async function replaceEvidence(itemId,evidenceId){const picker=document.createElement('input');picker.type='file';picker.accept='image/png,image/jpeg,image/webp,application/pdf';picker.onchange=async()=>{const file=picker.files?.[0];if(!file)return;if(!(file.type==='application/pdf'||file.type.startsWith('image/')))return alert('يسمح بالصور أو ملفات PDF فقط.');try{const up=await PrivateSchoolBridge.uploadModuleFile({moduleKey:'private_school_compliance',file,slotKey:itemId,recordType:'compliance_requirement',recordId:itemId,displayName:file.name});await PrivateSchoolBridge.compliance('link_evidence',{inspectionId:current.inspection.id,itemId,fileId:up.file.id});await PrivateSchoolBridge.compliance('remove_evidence',{inspectionId:current.inspection.id,evidenceId});await openInspection(current.inspection.id)}catch(e){alert(e.message||'تعذر استبدال الشاهد')}};picker.click()}
async function finalizeInspection(){if(!current)return;try{const done=await PrivateSchoolBridge.compliance('finalize',{inspectionId:current.inspection.id});const fresh=await PrivateSchoolBridge.compliance('get',{inspectionId:current.inspection.id});const out=await PrivateSchoolBridge.outputs('create',{title:'ملف فحص الالتزام — '+ctx.schoolName+' — '+fresh.inspection.academic_year+'هـ',sourceModule:'private_school_compliance',sourceRecordType:'compliance_inspection',sourceRecordId:fresh.inspection.id,sourceVersion:String(fresh.inspection.updated_at||fresh.inspection.completed_at||''),sourceUpdatedAt:fresh.inspection.updated_at||fresh.inspection.completed_at||null,outputType:'compliance_file',academicYear:fresh.inspection.academic_year,orientation:'portrait',contentSnapshot:{inspection:fresh.inspection,summary:fresh.summary,items:fresh.items,evidence:fresh.evidence}});await refreshList();location.href='private-output-preview.html?privateEdition=1&outputId='+encodeURIComponent(out.output.id)}catch(e){alert(e.message==='unsupported_evidence_type'?'يسمح برفع الصور أو ملفات PDF فقط.':e.message)}}
init();</script></body></html>
