<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص الالتزام | نظام إدارة المدارس الذكي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-supabase-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:#f1f5f9;color:#0f172a}.head{background:linear-gradient(135deg,#0f172a,#155e75);color:#fff;padding:28px}.bar,.wrap{width:min(1180px,94vw);margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{padding:24px 0 50px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px #0f172a0c}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.kpi{padding:16px;border-radius:18px;background:#f8fafc;border:1px solid #e2e8f0}.kpi b{font-size:25px;color:#0f766e}.btn{border:0;border-radius:12px;padding:10px 15px;font:inherit;font-weight:800;background:#0f766e;color:#fff;cursor:pointer}.btn.alt{background:#334155}.btn.light{background:#e2e8f0;color:#0f172a}.field{padding:11px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin:10px 0}.item.owner{border-right:5px solid #d97706}.item h3{margin:0 0 5px;font-size:16px}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#f1f5f9}.ok{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.na{background:#e0e7ff;color:#3730a3}.msg{display:none;padding:10px;border-radius:12px;margin-top:10px}.msg.show{display:block;background:#f1f5f9}@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.bar{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="head"><div class="bar"><div><h1 style="margin:0">فحص الالتزام</h1><div id="who" style="opacity:.8"></div></div><button class="btn light" onclick="back()">عودة</button></div></div><main class="wrap"><section class="card"><div class="row"><div><h2 style="margin:0">الفحص السنوي</h2><p class="muted">مشترك بين المالك ومدير المدرسة، مع حصر المتطلبات الخاصة بالمالك تلقائياً.</p></div><div class="actions"><select id="year" class="field"></select><button class="btn" onclick="createInspection()">إنشاء/فتح الفحص</button></div></div><div id="inspections" class="muted" style="margin-top:12px"></div><div id="msg" class="msg"></div></section><section id="detail" class="card" hidden><div class="grid kpis"><div class="kpi"><div>نسبة الإنجاز</div><b id="progress">0%</b></div><div class="kpi"><div>مكتمل</div><b id="completed">0</b></div><div class="kpi"><div>بانتظار الإكمال</div><b id="pending">0</b></div><div class="kpi"><div>غير منطبق</div><b id="na">0</b></div></div><div class="row" style="margin-top:18px"><h2 id="detailTitle" style="margin:0"></h2><button class="btn alt" id="finalizeBtn" onclick="finalizeInspection()">اعتماد الفحص</button></div><div id="items"></div></section></main><script>
let ctx=null,current=null;const $=id=>document.getElementById(id);function say(t,bad=false){$('msg').textContent=t;$('msg').className='msg show';$('msg').style.color=bad?'#b91c1c':'#166534'}
for(let y=1448;y<=1548;y++){let o=document.createElement('option');o.value=y;o.textContent=y+'هـ';year.appendChild(o)}year.value='1448';
async function init(){try{ctx=await PrivateSchool.requireRole(['owner','manager']);$('who').textContent=ctx.schoolName+' — '+ctx.userName;await loadList()}catch(e){say(e.message,true)}}
async function loadList(){try{let d=await PrivateSchool.compliance('list');let a=d.inspections||[];$('inspections').innerHTML=a.length?a.map(x=>`<button class="btn light" style="margin:3px" onclick="openInspection('${x.id}')">${escapeHtml(x.title||x.academic_year+'هـ')} — ${x.status==='completed'?'مكتمل':'قيد العمل'}</button>`).join(''):'لا يوجد فحص محفوظ بعد.'}catch(e){say(e.message,true)}}
async function createInspection(){try{let d=await PrivateSchool.compliance('create',{academicYear:Number(year.value)});await openInspection(d.inspection.id);await loadList();say('تم فتح فحص الالتزام للعام المحدد.')}catch(e){say(e.message,true)}}
async function openInspection(id){try{let d=await PrivateSchool.compliance('get',{inspectionId:id});current=d;$('detail').hidden=false;$('detailTitle').textContent=d.inspection.title;$('progress').textContent=d.summary.progress+'%';$('completed').textContent=d.summary.completed;$('pending').textContent=d.summary.pending;$('na').textContent=d.summary.notApplicable;$('finalizeBtn').disabled=d.inspection.status==='completed';renderItems(d.items||[])}catch(e){say(e.message,true)}}
function renderItems(items){$('items').innerHTML=items.map(x=>{let locked=x.owner_only&&ctx.role!=='owner',s=x.fulfillment_status||'pending',cls=s==='complete'?'ok':s==='not_applicable'?'na':'pending';return `<article class="item ${x.owner_only?'owner':''}"><div class="row"><div><h3>${x.requirement_order}. ${escapeHtml(x.item_title||x.title)}</h3><div class="muted">${escapeHtml(x.requirement_note||'')}${x.owner_only?' — خاص بالمالك':''}</div></div><span class="pill ${cls}">${s==='complete'?'مكتمل':s==='not_applicable'?'غير منطبق':'بانتظار الإكمال'}</span></div><div class="actions" style="margin-top:10px"><button class="btn" ${locked||current.inspection.status==='completed'?'disabled':''} onclick="setStatus('${x.id}','complete')">مكتمل</button><button class="btn alt" ${locked||current.inspection.status==='completed'?'disabled':''} onclick="setStatus('${x.id}','pending')">بانتظار شاهد</button>${x.is_conditional?`<button class="btn light" ${locked||current.inspection.status==='completed'?'disabled':''} onclick="setStatus('${x.id}','not_applicable')">غير منطبق</button>`:''}</div></article>`}).join('')}
async function setStatus(itemId,status){try{let note=status==='not_applicable'?prompt('سبب عدم الانطباق:','')||'':'';await PrivateSchool.compliance('set_requirement_status',{inspectionId:current.inspection.id,itemId,status,note});await openInspection(current.inspection.id)}catch(e){say(e.message,true)}}
async function finalizeInspection(){try{await PrivateSchool.compliance('finalize',{inspectionId:current.inspection.id});await openInspection(current.inspection.id);await loadList();say('تم اعتماد فحص الالتزام وإقفاله.')}catch(e){say(e.message==='requirements_incomplete'?'لا يمكن الاعتماد قبل إكمال جميع المتطلبات.':e.message,true)}}
function back(){location.href=(ctx?.role==='owner'?'private-owner-portal.html':'manager.html')+'?private=1&schoolId='+encodeURIComponent(ctx?.schoolId||PrivateSchool.getSchoolId())}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
