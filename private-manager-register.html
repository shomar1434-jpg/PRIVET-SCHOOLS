<!doctype html>
<html lang="ar" dir="rtl">
<head><script src="private-session-reset.js?v=20260820-session-reset1"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل مدير المدرسة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="private-school-bridge.js"></script>
<style>
:root{--green:#07a869;--turq:#0da9a6;--navy:#15445a;--ink:#17324a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf7f4,#e8f4f7);font-family:Tajawal,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.card{width:min(94vw,520px);background:#fff;border:1px solid #d9e6e8;border-radius:26px;padding:28px;box-shadow:0 24px 70px #15445a20}.mark{width:62px;height:62px;margin:auto;border-radius:20px;display:grid;place-items:center;background:#e8f7f3;font-size:31px}h1{text-align:center;margin:14px 0 6px;color:var(--navy)}.sub{text-align:center;color:#667985;line-height:1.7}.info{background:#f3f9f8;border-radius:14px;padding:12px 14px;margin:16px 0}.info b{display:block}.field{margin:12px 0}.field label{display:block;font-weight:900;font-size:13px;margin-bottom:6px}.field input{width:100%;border:1px solid #c9d9df;border-radius:12px;padding:12px;font:inherit}.readonly{background:#f5f7f8}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--green);color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{margin-top:12px;min-height:22px;font-size:13px;color:#b42318}.success{display:none;text-align:center;background:#edf9f3;border:1px solid #c9ead8;border-radius:16px;padding:16px;color:#087548;line-height:1.8}
</style></head>
<body><main class="card">
<div class="mark">🏫</div><h1>تسجيل مدير/مديرة المدرسة</h1><p class="sub">هذه الصفحة مخصصة لرابط المدير الصادر من مالك المدرسة فقط.</p>
<div id="loading" class="info">جارٍ التحقق من رابط التسجيل...</div>
<form id="form" hidden>
<div class="info"><b id="schoolName"></b><span id="schoolCode"></span></div>
<div class="field"><label>البريد الإلكتروني</label><input id="email" class="readonly" readonly></div>
<div class="field"><label>الاسم الكامل</label><input id="fullName" required></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
<button class="btn" type="submit">إكمال تسجيل المدير</button><div id="msg" class="msg"></div>
</form>
<div id="success" class="success"><b>تم تسجيل حساب المدير بنجاح.</b><br>الحساب الآن <strong>بانتظار تفعيل مالك المدرسة</strong>.<br>بعد التفعيل سيرسل لك المالك رابط الدخول الخاص بالمدرسة.</div>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';let invitation=null;
const $=id=>document.getElementById(id);
(async()=>{try{
 if(!token)throw new Error('رابط التسجيل غير مكتمل');
 const r=await PrivateSchoolBridge.inspectInvite(token);invitation=r.invitation;
 if(invitation.invite_role!=='manager')throw new Error('هذا الرابط غير مخصص لتسجيل مدير المدرسة');
 if(invitation.status!=='pending')throw new Error('رابط التسجيل مستخدم أو غير صالح');
 $('schoolName').textContent=invitation.schoolName||r.school?.school_name||'المدرسة';
 $('schoolCode').textContent=invitation.schoolCode||r.school?.school_code||'';
 $('email').value=invitation.invitee_email||invitation.email||'';
 $('fullName').value=invitation.invitee_name||'';
 $('loading').hidden=true;$('form').hidden=false;
}catch(e){$('loading').textContent=e.message||'تعذر التحقق من الرابط';$('loading').style.color='#b42318'}})();
$('form').onsubmit=async e=>{e.preventDefault();const msg=$('msg');msg.textContent='';
 try{
  if($('password').value!==$('confirmPassword').value)throw new Error('كلمتا المرور غير متطابقتين');
  const r=await PrivateSchoolBridge.acceptInvite({token,fullName:$('fullName').value.trim(),password:$('password').value});
  if(r.role!=='manager'||r.status!=='pending')throw new Error('تعذر إكمال تسجيل المدير بالحالة الصحيحة');
  $('form').hidden=true;$('success').style.display='block';
 }catch(err){msg.textContent=err.message||'تعذر إكمال التسجيل'}
};
</script></body></html>
