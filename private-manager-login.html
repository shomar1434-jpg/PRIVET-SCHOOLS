<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحويل إلى بوابة دخول المدرسة</title>
<script>
(function(){
  const q=new URLSearchParams(location.search||'');
  const sid=q.get('schoolId')||q.get('school_id')||'';
  const next=new URL('school-login.html',location.href);
  next.searchParams.set('edition','private');
  if(sid)next.searchParams.set('schoolId',sid);
  next.searchParams.set('role','manager');
  location.replace(next.href);
})();
</script>
</head>
<body></body>
</html>
