<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المخرجات المؤسسية | نظام إدارة المدارس الذكي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-supabase-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial;background:#f1f5f9;color:#0f172a}.head{background:linear-gradient(135deg,#0f172a,#155e75);color:#fff;padding:28px}.bar,.wrap{width:min(1120px,94vw);margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{padding:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.field{padding:11px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;width:100%}textarea.field{min-height:120px}.btn{border:0;border-radius:12px;padding:10px 15px;font:inherit;font-weight:800;background:#0f766e;color:#fff;cursor:pointer}.light{background:#e2e8f0;color:#0f172a}.output{border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:10px}.muted{color:#64748b;font-size:13px}.pill{padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:11px}.msg{display:none;padding:10px;margin-top:10px;background:#f1f5f9;border-radius:12px}.msg.show{display:block}@media(max-width:720px){.grid{grid-template-columns:1fr}.bar{flex-direction:column;align-items:flex-start}}</style></head><body><header class="head"><div class="bar"><div><h1 style="margin:0">المخرجات المؤسسية</h1><div id="who" style="opacity:.8"></div></div><button class="btn light" onclick="back()">عودة</button></div></header><main class="wrap"><section class="card"><h2>إنشاء مخرج مؤسسي</h2><div class="grid"><input id="title" class="field" placeholder="عنوان التقرير أو المخرج"><select id="type" class="field"><option value="institutional">مخرج مؤسسي</option><option value="compliance">تقرير التزام</option><option value="performance">تقرير أداء</option><option value="self_evaluation">تقويم ذاتي</option></select><select id="orientation" class="field"><option value="auto">تلقائي</option><option value="portrait">طولي</option><option value="landscape">عرضي</option></select></div><textarea id="content" class="field" style="margin-top:10px" placeholder="ملخص المحتوى أو بيانات المخرج"></textarea><div style="margin-top:10px"><button class="btn" onclick="createOutput()">حفظ المخرج</button></div><div id="msg" class="msg"></div></section><section class="card"><h2>الأرشيف المؤسسي</h2><div id="list" class="muted">جار التحميل...</div></section></main><script>
let ctx;const $=x=>document.getElementById(x);function say(t,b=false){$('msg').textContent=t;$('msg').className='msg show';$('msg').style.color=b?'#b91c1c':'#166534'}async function init(){try{ctx=await PrivateSchool.requireRole(['owner','manager']);who.textContent=ctx.schoolName+' — '+ctx.userName;await load()}catch(e){say(e.message,true)}}async function load(){try{let d=await PrivateSchool.outputs('list');let a=d.outputs||[];$('list').innerHTML=a.length?a.map(x=>`<article class="output"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(x.title)}</b><span class="pill">${x.status==='finalized'?'معتمد':'جاهز'}</span></div><div class="muted">${esc(x.output_type||'')} ${x.academic_year?'— '+esc(x.academic_year):''}</div><div style="margin-top:8px"><button class="btn light" onclick="preview('${x.id}')">معاينة</button>${x.status!=='finalized'?` <button class="btn" onclick="finalize('${x.id}')">اعتماد</button>`:''}</div></article>`).join(''):'لا توجد مخرجات محفوظة.'}catch(e){say(e.message,true)}}async function createOutput(){try{if(!title.value.trim())return say('أدخل عنوان المخرج.',true);await PrivateSchool.outputs('create',{title:title.value.trim(),outputType:type.value,orientation:orientation.value,contentSnapshot:{text:content.value.trim(),createdBy:ctx.userName},academicYear:'1448'});title.value='';content.value='';await load();say('تم حفظ المخرج المؤسسي.')}catch(e){say(e.message,true)}}async function preview(id){try{let d=await PrivateSchool.outputs('preview',{outputId:id}),o=d.output||{},t=d.template||{};let w=open('','_blank');w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>${esc(o.title)}</title><style>body{font-family:Arial;padding:35px;direction:rtl}header{border-bottom:3px solid #0f766e;padding-bottom:12px}footer{border-top:1px solid #ccc;margin-top:30px;padding-top:10px;color:#666}</style></head><body><header><b>وزارة التعليم</b><h2>${esc(t.schoolDisplayName||ctx.schoolName)}</h2></header><h1>${esc(o.title)}</h1><p style="white-space:pre-wrap">${esc((o.content_snapshot||{}).text||JSON.stringify(o.content_snapshot||{},null,2))}</p><footer>${esc(t.contactLine||'')}</footer></body></html>`);w.document.close()}catch(e){say(e.message,true)}}async function finalize(id){try{await PrivateSchool.outputs('finalize',{outputId:id,pageCount:1});await load();say('تم اعتماد المخرج المؤسسي.')}catch(e){say(e.message,true)}}function back(){location.href=(ctx?.role==='owner'?'private-owner-portal.html':'manager.html')+'?private=1&schoolId='+encodeURIComponent(ctx?.schoolId||PrivateSchool.getSchoolId())}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
