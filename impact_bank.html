<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنك قياس الأثر</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="school_isolation_guard.js?v=nonblock20260614"></script><style>
:root{--navy:#063f4b;--teal:#2d9fa4;--green:#0f766e;--line:#dbe5e7;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:'Tajawal',Arial,sans-serif;background:#f4f8f8;color:#0f172a}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.topin{max-width:1200px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;color:var(--navy);font-size:23px;font-weight:900}.top p{margin:3px 0;color:var(--muted);font-size:11px;font-weight:700}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--green);color:white;font-family:inherit;font-weight:900;cursor:pointer}.btn.secondary{background:white;color:var(--navy);border:1px solid var(--line)}.wrap{max-width:1200px;margin:24px auto;padding:0 18px 50px}.toolbar{display:grid;grid-template-columns:1fr 220px 160px;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:12px;padding:11px;font-family:inherit;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 13px 30px rgba(15,23,42,.06);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 18px 35px rgba(15,23,42,.1)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#e6fffa;color:#0f766e;font-size:10px;font-weight:900}.card h3{margin:12px 0 8px;color:var(--navy);font-size:17px}.meta{font-size:11px;color:var(--muted);font-weight:700;line-height:1.9}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.score{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px;text-align:center}.score small{display:block;color:var(--muted);font-size:9px}.score b{display:block;color:var(--green);font-size:16px}.empty{background:#fff;border:1px dashed #b9c8cd;border-radius:22px;padding:40px;text-align:center;color:var(--muted);font-weight:800}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal-card{width:min(980px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:15px}.modal-head h2{margin:0;color:var(--navy)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #aebbc0;padding:7px;text-align:center;font-size:11px}th{background:#d9d9d9}.section th{background:var(--teal);color:#082c32;font-weight:900}.dev{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dev>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:11px}.dev b{color:var(--green)}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}@media(max-width:850px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.dev{grid-template-columns:1fr}}@media print{.top,.toolbar,.grid,.modal-actions{display:none!important}.modal{display:block!important;position:static;background:white;padding:0}.modal-card{width:100%;max-height:none;border-radius:0;padding:0}.modal-head button{display:none}.modal-card{box-shadow:none}body{background:white}}
</style></head><body><header class="top"><div class="topin"><div><h1>بنك قياس الأثر</h1><p>بطاقات البرامج المحفوظة وفق استمارة تقييم وتطوير ومتابعة وقياس الأثر</p></div><div><button class="btn secondary" onclick="history.back()">العودة</button> <button class="btn" onclick="location.href='impact_assessment.html'">نموذج جديد</button></div></div></header><main class="wrap"><div class="toolbar"><input id="search" placeholder="ابحث باسم البرنامج أو الجهة المنفذة" oninput="render()"><select id="roleFilter" onchange="render()"><option value="">كل الأقسام</option><option value="manager">المدير/المديرة</option><option value="agent">الوكيل/الوكيلة</option><option value="teacher">المعلم/المعلمة</option><option value="student_advisor">الموجه/الموجهة الطلابية</option><option value="activity_leader">رائد/رائدة النشاط</option><option value="health_advisor">الموجه/الموجهة الصحية</option><option value="kindergarten_teacher">معلمة رياض الأطفال</option><option value="admin_employee">الموظف/الموظفة الإدارية</option></select><select id="sort" onchange="render()"><option value="new">الأحدث</option><option value="old">الأقدم</option></select></div><div id="cards" class="grid"></div></main><div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><h2 id="mTitle">بطاقة قياس الأثر</h2><button class="btn secondary" onclick="closeModal()">إغلاق</button></div><div id="details"></div><div class="modal-actions"><button class="btn secondary" onclick="window.print()">طباعة البطاقة</button><button class="btn" onclick="closeModal()">عودة للبنك</button></div></div></div><script>
const STORAGE='schoolImpactAssessments';const roles={manager:'المدير/المديرة',agent:'الوكيل/الوكيلة',teacher:'المعلم/المعلمة',student_advisor:'الموجه/الموجهة الطلابية',activity_leader:'رائد/رائدة النشاط',health_advisor:'الموجه/الموجهة الصحية',kindergarten_teacher:'معلمة رياض الأطفال',admin_employee:'الموظف/الموظفة الإدارية'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function all(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){return[]}}function val(r,k,f=''){return r?.[k]??f}function normalize(r){if(r.schemaVersion===2)return r;const impacts=(r.metrics||[]).slice(0,4).map((m,i)=>({item:m.name||['رفع مستوى الوعي أو المهارة','تحسن في سلوك أو أداء المشاركين','تطبيق مخرجات البرنامج في الواقع','تحقيق أهداف البرنامج المعلنة'][i]||'أثر متوقع',percent:Number(m.after||m.improvement)||0,evidence:(r.evidence||[])[i]?.ref||''}));while(impacts.length<4)impacts.push({item:['رفع مستوى الوعي أو المهارة','تحسن في سلوك أو أداء المشاركين','تطبيق مخرجات البرنامج في الواقع','تحقيق أهداف البرنامج المعلنة'][impacts.length],percent:'',evidence:''});return{...r,schemaVersion:1,executingEntity:r.roleLabel||roles[r.role]||'',executionDate:r.measureDate||'',targetCategory:r.target||'',attendanceCount:'',planningEvaluation:[],fieldFollowup:[],impactTool:(r.metrics||[])[0]?.tool||'',impactAssessment:impacts,planningScore:0,followScore:0,strengths:r.findings||'',challenges:r.conclusion||'',developmentProposals:r.recommendations||'',evaluatorName:'',evaluationDate:r.measureDate||'',evaluatorSignature:''}}
function render(){let a=all().map(normalize);const q=document.getElementById('search').value.trim();const role=document.getElementById('roleFilter').value;if(q)a=a.filter(r=>(r.programName+' '+r.executingEntity).includes(q));if(role)a=a.filter(r=>r.role===role);a.sort((x,y)=>(document.getElementById('sort').value==='old'?1:-1)*(new Date(x.createdAt||0)-new Date(y.createdAt||0)));const box=document.getElementById('cards');if(!a.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">لا توجد بطاقات قياس أثر محفوظة حتى الآن.</div>';return}box.innerHTML=a.map((r,i)=>`<article class="card" onclick="openCard('${esc(r.id)}')"><span class="badge">${r.schemaVersion===2?'النموذج المحدّث':'سجل سابق'}</span><h3>${esc(r.programName||'برنامج بدون اسم')}</h3><div class="meta">الجهة المنفذة: ${esc(r.executingEntity||r.roleLabel||roles[r.role]||'—')}<br>تاريخ التنفيذ: ${esc(r.executionDate||'—')}<br>الفئة المستهدفة: ${esc(r.targetCategory||'—')}</div><div class="scores"><div class="score"><small>التخطيط</small><b>${Number(r.planningScore)||0}%</b></div><div class="score"><small>المتابعة</small><b>${Number(r.followScore)||0}%</b></div><div class="score"><small>الأثر</small><b>${Number(r.avgImprovement)||0}%</b></div></div></article>`).join('')}
function openCard(id){const raw=all().find(x=>String(x.id)===String(id));if(!raw)return;const r=normalize(raw);document.getElementById('mTitle').textContent='بطاقة قياس الأثر — '+(r.programName||'');const p=(r.planningEvaluation||[]).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.rating||'—')}</td><td>${esc(x.notes||'')}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات تقييم تخطيط في السجل القديم.</td></tr>';const f=(r.fieldFollowup||[]).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.value||'—')}</td><td>${esc(x.notes||'')}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بيانات متابعة ميدانية في السجل القديم.</td></tr>';const im=(r.impactAssessment||[]).map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.percent)}%</td><td>${esc(x.evidence||'')}</td></tr>`).join('');document.getElementById('details').innerHTML=`<table><tr class="section"><th colspan="2">معلومات عامة عن البرنامج</th></tr><tr><th>اسم البرنامج</th><td>${esc(r.programName)}</td></tr><tr><th>الجهة المنفذة</th><td>${esc(r.executingEntity)}</td></tr><tr><th>تاريخ التنفيذ</th><td>${esc(r.executionDate)}</td></tr><tr><th>الفئة المستهدفة</th><td>${esc(r.targetCategory)}</td></tr><tr><th>عدد الحضور</th><td>${esc(r.attendanceCount)}</td></tr></table><table><tr class="section"><th colspan="3">تقييم التخطيط والتنفيذ</th></tr><tr><th>العنصر</th><th>التقييم</th><th>الملاحظات</th></tr>${p}</table><table><tr class="section"><th colspan="3">مؤشرات المتابعة الميدانية</th></tr><tr><th>المؤشر</th><th>نعم/لا</th><th>الملاحظات</th></tr>${f}</table><table><tr class="section"><th colspan="3">قياس أثر البرنامج على الفئة المستهدفة</th></tr><tr><th>الأثر المتوقع</th><th>نسبة التحقق</th><th>الأدلة والشواهد</th></tr>${im}</table><p><b>أداة قياس الأثر:</b> ${esc(r.impactTool||'—')}</p><p><b>اسم المقيم:</b> ${esc(r.evaluatorName||'—')} &nbsp; <b>التاريخ:</b> ${esc(r.evaluationDate||'—')}</p><div class="dev"><div><b>أبرز نقاط القوة</b><p>${esc(r.strengths||'—')}</p></div><div><b>أبرز التحديات</b><p>${esc(r.challenges||'—')}</p></div><div><b>مقترحات التطوير</b><p>${esc(r.developmentProposals||'—')}</p></div></div>`;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}render();
</script></body></html>
