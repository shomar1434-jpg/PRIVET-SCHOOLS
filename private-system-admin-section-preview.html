<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أقسام المدارس الخاصة — مدير النظام</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="private-school-bridge.js"></script>
<style>
:root{--green:#07a869;--blue:#3d7eb9;--turq:#0da9a6;--navy:#15445a;--gold:#c1b489;--gray:#c2c1c1;--ink:#17324a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4faf8,#eef6f9);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 38px}
.top{background:linear-gradient(120deg,var(--navy),#0b7565);color:#fff;border-radius:24px;padding:20px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;box-shadow:0 16px 38px #15445a22}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;color:#daf1ec}.btn{border:0;border-radius:12px;padding:10px 15px;font:inherit;font-weight:900;cursor:pointer}.back{background:#fff;color:var(--navy)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.metric{background:#fff;border:1px solid #dce7eb;border-radius:18px;padding:16px;box-shadow:0 9px 25px #15445a0b}.metric b{display:block;font-size:27px;color:var(--navy)}.metric span{font-size:12px;color:#687b87;font-weight:700}
.panel{background:#fff;border:1px solid #dce7eb;border-radius:21px;padding:18px;box-shadow:0 10px 28px #15445a0d}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel h2{margin:0;color:var(--navy)}.muted{color:#6b7d88;font-size:13px;line-height:1.7}.directory{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}.entry{border:1px solid #e0e8ec;border-radius:17px;padding:15px;background:#fbfdfd}.entry-top{display:flex;justify-content:space-between;gap:12px}.name{font-weight:900;font-size:16px}.email{font-size:12px;color:#6a7b87;direction:ltr;text-align:right;margin-top:4px}.school{margin-top:10px;padding-top:9px;border-top:1px solid #edf2f4;font-size:12px;color:#526b78}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;height:max-content}.active{background:#e8f8ef;color:#087548}.pending{background:#fff7df;color:#8c6500}.disabled,.archived{background:#f0f2f4;color:#606970}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:var(--green);color:#fff}.secondary{background:#eaf3f7;color:var(--navy)}.empty{padding:32px;text-align:center;color:#788893;background:#f8fbfb;border:1px dashed #cbdadd;border-radius:17px;margin-top:14px}.loading{padding:32px;text-align:center;color:#5d7480}.static-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}.static-card{border:1px solid #e0e8ec;border-radius:17px;padding:15px;background:#fbfdfd}.static-card .icon{font-size:29px}.static-card h3{margin:8px 0 5px;color:var(--navy)}.notice{margin:14px 0;background:#eff8f6;border-right:4px solid var(--turq);border-radius:13px;padding:11px 13px;font-size:12px;color:#42635e}
@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.summary{grid-template-columns:1fr}.directory{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><h1 id="title">القسم</h1><p id="subtitle">عرض تشغيلي حي لمدير النظام مع عزل المدارس.</p></div><button class="btn back" onclick="goBack()">العودة إلى الأقسام</button></header>
<div id="liveArea"><section class="summary"><div class="metric"><b id="entryCount">—</b><span>الحسابات في هذا القسم</span></div><div class="metric"><b id="schoolCount">—</b><span>إجمالي المدارس</span></div><div class="metric"><b id="activeSchools">—</b><span>المدارس النشطة</span></div></section>
<section class="panel"><div class="panel-head"><div><h2 id="dirTitle">المستخدمون المرتبطون</h2><div class="muted">كل بطاقة مربوطة بمعرف المدرسة الخاص بها ولا يمكن دمج المستخدمين بين المدارس.</div></div><button class="btn secondary" onclick="loadDirectory()">تحديث</button></div><div id="directory" class="loading">جارٍ تحميل البيانات من Supabase…</div></section></div>
<div id="staticArea" hidden></div>
</main>
<script>
const q=new URLSearchParams(location.search),section=q.get('section')||'owner';
const roleMeta={
 owner:['قسم مالك المدرسة','owner','الملاك'],
 manager:['قسم مدير/ة المدرسة','manager','المديرون والمديرات'],
 agent:['قسم الوكيل/ة','agent','الوكلاء والوكيلات'],
 teacher:['قسم المعلم/المعلمة','teacher','المعلمون والمعلمات'],
 student_advisor:['قسم الموجه/الموجهة الطلابية','student_advisor','الموجهون والموجهات الطلابية'],
 health_advisor:['قسم الموجه الصحي','health_advisor','الموجهون الصحيون'],
 activity_leader:['قسم رائد/ة النشاط','activity_leader','رواد ورائدات النشاط'],
 kindergarten_teacher:['قسم معلمة رياض الأطفال','kindergarten_teacher','معلمات رياض الأطفال'],
 administrative_employee:['قسم الموظف/ة الإداري/ة','administrative_employee','الموظفون والموظفات الإداريون']
};
const staticData={
 compliance:{title:'فحص الالتزام',cards:[['📄','التراخيص الأساسية','الترخيص التشغيلي والسلامة والسجل التجاري والمتطلبات النظامية.'],['🏢','بيانات المستثمر','مطابقة بيانات المنشأة والاستثمار.'],['👔','متطلبات مدير المدرسة','التكليف والعقد والبيانات النظامية.'],['🎓','الطلاب والمعلمون','التسجيل والغياب والطاقة الاستيعابية.']]},
 template:{title:'هوية وقالب المدرسة',cards:[['🏫','بيانات المدرسة','الاسم والإدارة التعليمية وبيانات التواصل.'],['✍️','التوقيعات','توقيع المالك والمدير.'],['🔏','الختم الرقمي','الختم الموحد للمخرجات الرسمية.'],['📐','قواعد التقارير','قالب موحد للطباعة والمخرجات.']]},
 outputs:{title:'المخرجات المؤسسية',cards:[['🗂️','الأرشيف الموحد','حفظ المخرجات حسب المدرسة والعام.'],['🔒','النسخة المعتمدة','تجميد المخرج بعد الاعتماد.'],['📄','PDF نهائي','المخرج النهائي الرسمي.'],['📋','سجل الأحداث','تتبع الإنشاء والاعتماد والطباعة.']]}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function statusLabel(s){return s==='active'?'نشط':s==='pending'?'بانتظار التفعيل':s==='disabled'?'معطل':s==='archived'?'مؤرشف':s||'—'}
function goBack(){location.href=q.get('returnHome')||'index.html?systemAdminReturn=1&edition=private'}
function client(){if(window.__privateSystemAdminClient)return window.__privateSystemAdminClient;if(!window.supabase?.createClient)throw new Error('تعذر تهيئة اتصال Supabase');const c=window.StandalonePrivateConfig||{};window.__privateSystemAdminClient=window.supabase.createClient(c.supabaseUrl,c.publishableKey,{auth:{storageKey:'PRIVATE_SCHOOLS_SYSTEM_ADMIN_AUTH_V1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});return window.__privateSystemAdminClient}
async function sys(body){const c=client();const s=await c.auth.getSession();if(!s.data?.session)throw new Error('انتهت جلسة مدير النظام. ارجع إلى الأقسام وسجل الدخول من جديد.');const r=await c.functions.invoke('system-admin',{body});if(r.error){let msg=r.data?.error||r.error.message||'تعذر تحميل بيانات القسم';if(/non-2xx/i.test(msg))msg='رفض الخادم الطلب. تحقق من جلسة مدير النظام ثم أعد المحاولة.';throw new Error(msg)}if(r.data?.error)throw new Error(r.data.error);return r.data}
function openOwner(path){location.href=new URL(path,location.href).href}
function openSchool(id){location.href='private-system-admin.html?systemAdmin=1&schoolId='+encodeURIComponent(id)}
async function loadDirectory(){
 const meta=roleMeta[section];if(!meta)return;
 document.getElementById('directory').className='loading';document.getElementById('directory').textContent='جارٍ تحميل البيانات من Supabase…';
 try{
   const v=await sys({action:'verify'});if(!v?.ok)throw new Error('جلسة مدير النظام غير صالحة');
   const d=await sys({action:'role_directory',role:meta[1]});const rows=d.entries||[];
   document.getElementById('entryCount').textContent=rows.length;document.getElementById('schoolCount').textContent=d.schoolCount||0;document.getElementById('activeSchools').textContent=d.activeSchoolCount||0;
   const box=document.getElementById('directory');box.className='directory';
   box.innerHTML=rows.length?rows.map(x=>`<article class="entry"><div class="entry-top"><div><div class="name">${esc(x.name||x.displayName||x.email||'بدون اسم')}</div><div class="email">${esc(x.email||'')}</div></div><span class="badge ${esc(x.status||'disabled')}">${esc(statusLabel(x.status))}</span></div><div class="school"><b>${esc(x.school?.school_name||'')}</b><br><span dir="ltr">${esc(x.school?.school_code||'')}</span> • ${esc(statusLabel(x.school?.status))}</div><div class="actions">${section==='owner'&&x.loginPath&&x.school?.status==='active'?`<button class="btn primary" onclick="openOwner('${esc(x.loginPath)}')">بوابة دخول المالك</button>`:''}<button class="btn secondary" onclick="openSchool('${esc(x.school?.id||'')}')">تفاصيل المدرسة</button></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1">لا توجد حسابات مرتبطة بهذا القسم حتى الآن.</div>`;
 }catch(e){document.getElementById('directory').className='empty';document.getElementById('directory').textContent=e.message||'تعذر تحميل البيانات'}
}
(function init(){
 if(roleMeta[section]){
   const m=roleMeta[section];document.getElementById('title').textContent=m[0];document.getElementById('dirTitle').textContent=m[2];loadDirectory();return;
 }
 const d=staticData[section]||staticData.compliance;document.getElementById('liveArea').hidden=true;const s=document.getElementById('staticArea');s.hidden=false;document.getElementById('title').textContent=d.title;s.innerHTML=`<section class="panel"><h2>${d.title}</h2><div class="notice">هذه الأدوات التشغيلية مشتركة بين المالك ومدير المدرسة، وتُحفظ بيانات كل مدرسة تحت school_id مستقل.</div><div class="static-grid">${d.cards.map(c=>`<article class="static-card"><div class="icon">${c[0]}</div><h3>${c[1]}</h3><div class="muted">${c[2]}</div></article>`).join('')}</div></section>`;
})();
</script></body></html>
