<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هوية وقالب المدرسة الخاصة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="private-school-bridge.js"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fb;font-family:Tajawal;color:#17263a}.wrap{max-width:1120px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#0b3d2f,#1b8a61);color:#fff;padding:22px;border-radius:26px;box-shadow:0 14px 38px #0b3d2f30}.card{background:#fff;border:1px solid #dce8ef;border-radius:22px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #ccd7df;border-radius:12px;font-family:inherit}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}.asset{border:1px solid #e2e8f0;border-radius:16px;padding:14px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:9px;justify-content:space-between}.asset img{max-width:100%;height:80px;object-fit:contain}.btn{border:0;border-radius:12px;padding:11px 15px;font-family:inherit;font-weight:900;cursor:pointer;background:#0f6b4a;color:#fff}.muted{color:#64748b;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.assets{grid-template-columns:repeat(2,1fr)}}</style><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="wrap"><header class="hero"><h1 style="margin:0">هوية المدرسة والقالب المؤسسي</h1><p class="muted" style="color:#d8f4ea;margin:6px 0 0">مساحة مشتركة بين المالك ومدير المدرسة</p><p id="school" style="margin-bottom:0"></p></header><section class="card"><div class="grid"><div class="field"><label>الإدارة التعليمية</label><input id="educationDepartment"></div><div class="field"><label>اسم المدرسة في المخرجات</label><input id="schoolDisplayName"></div><div class="field"><label>اسم المالك في المخرجات</label><input id="ownerDisplayName"></div><div class="field"><label>اسم المدير في المخرجات</label><input id="managerDisplayName"></div><div class="field"><label>تذييل التواصل</label><input id="contactFooter"></div><div class="field"><label>اتجاه الطباعة الافتراضي</label><select id="defaultOrientation"><option value="auto">تلقائي</option><option value="portrait">طولي</option><option value="landscape">عرضي</option></select></div></div></section><section class="card"><h2>الصور المعتمدة</h2><p class="muted">ترفع الصور إلى مساحة المدرسة الخاصة وتنعكس على المخرجات الرسمية.</p><div class="assets" id="assets"></div></section><section class="card" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="saveProfile()">حفظ الهوية والقالب</button><button class="btn" style="background:#fff;color:#0b3d2f;border:1px solid #cfe4d9" onclick="history.back()">رجوع</button><span id="msg" class="muted"></span></section></div><script>
let ctx,profile={},fileIds={};const specs=[['ministryLogoFileId','شعار الوزارة'],['schoolLogoFileId','شعار المدرسة'],['ownerSignatureFileId','توقيع المالك'],['managerSignatureFileId','توقيع المدير'],['digitalStampFileId','الختم الرقمي']];
async function init(){try{
ctx=await PrivateSchoolBridge.requireContext(['owner','manager']);
document.getElementById('school').textContent=ctx.schoolName+' • '+(ctx.role==='owner'?'المالك':'مدير المدرسة');
const t=await PrivateSchoolBridge.template({});
profile=t.profile||t.output||{};
['educationDepartment','schoolDisplayName','ownerDisplayName','managerDisplayName','contactFooter','defaultOrientation'].forEach(id=>{
 const key=id.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());
 const v=t.output?.[id]??profile[key]??profile[id]??'';
 document.getElementById(id).value=v||'';
});
for(const [id] of specs){
 const key=id.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());
 fileIds[id]=profile[key]||profile[id]||'';
}
renderAssets(t.output||{});
}catch(e){alert(e.message);history.length>1?history.back():location.href=(ctx?.role==='manager'?'manager.html':'private-owner-portal.html')}}
function renderAssets(output){const urlKey={ministryLogoFileId:'ministry_logoUrl',schoolLogoFileId:'school_logoUrl',ownerSignatureFileId:'owner_signatureUrl',managerSignatureFileId:'manager_signatureUrl',digitalStampFileId:'digital_stampUrl'};document.getElementById('assets').innerHTML=specs.map(([id,label])=>`<div class="asset"><b>${label}</b><div style="margin:8px 0">${output[urlKey[id]]?`<img src="${output[urlKey[id]]}">`:'<div class="muted" style="height:80px;display:grid;place-items:center">لا توجد صورة</div>'}</div><input type="file" id="file_${id}" accept="image/png,image/jpeg,image/webp"><button class="btn" style="margin-top:7px;padding:8px 10px" onclick="uploadAsset('${id}')">رفع</button></div>`).join('')}
async function uploadAsset(id){const input=document.getElementById('file_'+id),file=input?.files?.[0];if(!file)return alert('اختر صورة أولًا.');try{const up=await PrivateSchoolBridge.uploadModuleFile({moduleKey:'private_school_template',file,slotKey:id,recordType:'template_asset',recordId:id,displayName:file.name});fileIds[id]=up.file.id;document.getElementById('msg').textContent='تم رفع الصورة. اضغط حفظ الهوية والقالب لتثبيتها.'}catch(e){alert(e.message)}}
async function saveProfile(){const msg=document.getElementById('msg');try{
msg.textContent='جارٍ الحفظ...';
const profilePayload={educationDepartment:educationDepartment.value,schoolDisplayName:schoolDisplayName.value,ownerDisplayName:ownerDisplayName.value,managerDisplayName:managerDisplayName.value,contactFooter:contactFooter.value,defaultOrientation:defaultOrientation.value,...fileIds};
await PrivateSchoolBridge.template({action:'save_profile',profile:profilePayload,actorRole:ctx.role});
msg.textContent='تم حفظ الهوية والقالب المشترك بنجاح.';
setTimeout(()=>location.reload(),500);
}catch(e){msg.textContent=e.message||'تعذر الحفظ'}}
init();</script></body></html>
