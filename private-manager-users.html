<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مستخدمي المدرسة الخاصة</title><style>
body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;background:#f6f8fa;color:#17324d}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4eaf0;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}input,select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:11px;border:1px solid #ccd6e0;font:inherit}button{border:0;background:#15445A;color:#fff;font-weight:700;cursor:pointer}.muted{color:#6b7c8b}.row{display:grid;grid-template-columns:1.5fr 1fr .8fr .8fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f5}.danger{background:#9b2c2c}.success{background:#087f5b}.msg{min-height:24px}.badge{padding:4px 8px;border-radius:999px;background:#edf4f6;font-size:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="private-school-theme.css"><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="wrap">
<div class="card"><h1>إدارة مستخدمي المدرسة</h1><p class="muted" id="schoolLabel">جارٍ التحقق من الجلسة...</p></div>
<div class="card"><h2>دعوة مستخدم</h2><form id="inviteForm" class="grid"><input id="name" placeholder="اسم المستخدم" required><input id="email" type="email" placeholder="البريد الإلكتروني" required><select id="role"><option value="agent">وكيل المدرسة</option><option value="teacher">معلم/معلمة</option><option value="student_advisor">الموجه الطلابي</option><option value="activity_leader">رائد النشاط</option><option value="kindergarten_teacher">معلمة رياض الأطفال</option><option value="health_advisor">الموجه الصحي</option><option value="administrative_employee">الموظف الإداري</option></select><button>إرسال الدعوة</button></form><p id="inviteMsg" class="msg muted"></p></div>
<div class="card"><h2>الأعضاء</h2><div id="members" class="muted">جارٍ التحميل...</div></div>
<div class="card"><h2>الدعوات</h2><div id="invites" class="muted">جارٍ التحميل...</div></div>
</div>
<script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="private-school-bridge.js"></script><script src="private-school-page-guard.js"></script>
<script>
(async function(){const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ctx;try{ctx=await PrivateSchoolBridge.requireContext(['manager']);$('schoolLabel').textContent=ctx.schoolName||'المدرسة الخاصة';}catch(e){return}const roleLabel={agent:'وكيل',teacher:'معلم/معلمة',student_advisor:'موجه طلابي',activity_leader:'رائد نشاط',kindergarten_teacher:'معلمة رياض أطفال',health_advisor:'موجه صحي',administrative_employee:'موظف إداري'};
async function load(){try{const d=await PrivateSchoolBridge.manager('get_portal');$('members').innerHTML=(d.members||[]).map(m=>`<div class="row"><div>${esc(m.email)}</div><div>${esc(roleLabel[m.role]||m.role)}</div><div><span class="badge">${esc(m.status)}</span></div><div>${roleLabel[m.role]?`<button data-member="${esc(m.id)}" data-status="${m.status==='active'?'disabled':'active'}" class="${m.status==='active'?'danger':'success'}">${m.status==='active'?'تعطيل':'تفعيل'}</button>`:''}</div></div>`).join('')||'لا يوجد أعضاء';$('invites').innerHTML=(d.invitations||[]).map(i=>`<div class="row"><div>${esc(i.invitee_name||i.invitee_email)}</div><div>${esc(roleLabel[i.invite_role]||i.invite_role)}</div><div><span class="badge">${esc(i.status)}</span></div><div>${i.status==='pending'?`<button class="danger" data-invite="${esc(i.id)}">إلغاء</button>`:''}</div></div>`).join('')||'لا توجد دعوات';}catch(e){$('members').textContent=e.message||'تعذر تحميل الأعضاء'}}
$('inviteForm').addEventListener('submit',async e=>{e.preventDefault();$('inviteMsg').textContent='جارٍ الإرسال...';try{const r=await PrivateSchoolBridge.manager('create_invitation',{inviteeName:$('name').value.trim(),inviteeEmail:$('email').value.trim(),inviteRole:$('role').value});$('inviteMsg').textContent='تم إنشاء الدعوة: '+(r.invitePath||'');$('inviteForm').reset();await load();}catch(x){$('inviteMsg').textContent=x.message||'تعذر إنشاء الدعوة'}});
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-member],button[data-invite]');if(!b)return;b.disabled=true;try{if(b.dataset.member)await PrivateSchoolBridge.manager('set_member_status',{memberId:b.dataset.member,status:b.dataset.status});else await PrivateSchoolBridge.manager('cancel_invitation',{invitationId:b.dataset.invite});await load();}catch(x){alert(x.message||'تعذر تنفيذ العملية')}finally{b.disabled=false}});await load();})();
</script></body></html>
