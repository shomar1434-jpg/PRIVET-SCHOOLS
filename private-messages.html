<!doctype html><html lang="ar" dir="rtl"><head>

<script src="private-storage-namespace.js"></script><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراسلات المدرسة الخاصة</title><style>
body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;background:#f6f8fa;color:#17324d}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4eaf0;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:11px;border:1px solid #ccd6e0;font:inherit}textarea{min-height:120px}button{border:0;background:#15445A;color:#fff;font-weight:700;cursor:pointer}.row{padding:12px;border-bottom:1px solid #eef2f5}.muted{color:#6b7c8b}.unread{font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="private-school-theme.css"><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="wrap"><div class="card"><h1>المراسلات الداخلية</h1><p id="policy" class="muted"></p></div><div class="card"><h2>رسالة جديدة</h2><form id="sendForm"><div class="grid"><select id="recipient" required></select><select id="priority"><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select></div><input id="subject" placeholder="الموضوع" required style="margin-top:12px"><textarea id="body" placeholder="نص الرسالة" required style="margin-top:12px"></textarea><button style="margin-top:12px">إرسال</button></form><p id="msg" class="muted"></p></div><div class="card"><h2>الوارد</h2><div id="inbox">جارٍ التحميل...</div></div></div>
<script src="standalone-private-config.js"></script>
<script src="private-school-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="private-school-bridge.js"></script><script src="private-school-page-guard.js"></script><script>
(async function(){const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ctx;try{ctx=await PrivateSchoolBridge.requireContext();}catch(e){return}async function loadContacts(){const d=await PrivateSchoolBridge.messages('contacts');let contacts=Array.isArray(d.contacts)?d.contacts:[];if(ctx.role==='owner')contacts=contacts.filter(c=>String(c.role||'')==='manager');$('policy').textContent=ctx.role==='owner'?'مراسلات مالك المدرسة مخصصة لمدير/مديرة المدرسة فقط.':(d.policy||'');$('recipient').innerHTML=contacts.map(c=>`<option value="${esc(c.user_id)}">${esc(c.label||c.email||c.role)}</option>`).join('');if(!contacts.length)$('recipient').innerHTML='<option value="">لا يوجد مدير/مديرة نشط/ة حاليًا</option>'}async function loadInbox(){const d=await PrivateSchoolBridge.messages('inbox');$('inbox').innerHTML=(d.messages||[]).map(m=>`<div class="row ${m.read_at?'':'unread'}" data-id="${esc(m.id)}"><div>${esc(m.subject)}</div><small class="muted">${esc(m.sender_name||m.sender_role||'')}</small></div>`).join('')||'<span class="muted">لا توجد رسائل</span>'} $('sendForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='جارٍ الإرسال...';try{await PrivateSchoolBridge.messages('send',{recipientUserId:$('recipient').value,subject:$('subject').value.trim(),body:$('body').value.trim(),priority:$('priority').value});$('sendForm').reset();$('msg').textContent='تم الإرسال بنجاح';await loadInbox()}catch(x){$('msg').textContent=x.message||'تعذر الإرسال'}});document.addEventListener('click',async e=>{const r=e.target.closest('.row[data-id]');if(!r)return;try{const d=await PrivateSchoolBridge.messages('read',{messageId:r.dataset.id});alert((d.message?.subject||'')+'\n\n'+(d.message?.body||''));await loadInbox()}catch(x){alert(x.message||'تعذر فتح الرسالة')}});await loadContacts();await loadInbox();})();
</script></body></html>
