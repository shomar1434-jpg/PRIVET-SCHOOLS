<!doctype html><html lang="ar" dir="rtl"><head><script src="private-session-reset.js?v=20260820-session-reset1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراسلات المدرسة الخاصة</title><style>
body{font-family:system-ui,"Segoe UI",sans-serif;margin:0;background:#f6f8fa;color:#17324d}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4eaf0;border-radius:18px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:11px;border:1px solid #ccd6e0;font:inherit}textarea{min-height:120px}button{border:0;background:#15445A;color:#fff;font-weight:700;cursor:pointer}.row{padding:12px;border-bottom:1px solid #eef2f5}.muted{color:#6b7c8b}.unread{font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="private-school-theme.css"><link rel="stylesheet" href="private-ui-system.css?v=20260820-uiux2"></head><body><div class="wrap"><div class="card"><h1>المراسلات الداخلية</h1><p id="policy" class="muted"></p></div><div class="card"><h2>رسالة جديدة</h2><form id="sendForm"><div class="grid"><select id="targetMode"><option value="person">شخص محدد</option><option value="group">مجموعة</option></select><select id="priority"><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select></div><div id="personBox" style="margin-top:12px"><select id="recipient"></select></div><div id="groupBox" style="margin-top:12px;display:none"><select id="group"></select><div id="groupHint" class="muted" style="font-size:12px;margin-top:6px"></div></div><input id="subject" placeholder="الموضوع" required style="margin-top:12px"><textarea id="body" placeholder="نص الرسالة" required style="margin-top:12px"></textarea><button style="margin-top:12px">إرسال</button></form><p id="msg" class="muted"></p></div><div class="card"><h2>الوارد</h2><div id="inbox">جارٍ التحميل...</div></div></div>
<script src="standalone-private-config.js"></script><script src="private-school-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="private-school-bridge.js"></script><script src="private-school-page-guard.js"></script><script>
(async function(){const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ctx,contacts=[],groups=[];try{ctx=await PrivateSchoolBridge.requireContext();}catch(e){return}
function syncMode(){const groupMode=$('targetMode').value==='group';$('personBox').style.display=groupMode?'none':'block';$('groupBox').style.display=groupMode?'block':'none'}
async function loadContacts(){const d=await PrivateSchoolBridge.messages('contacts');contacts=Array.isArray(d.contacts)?d.contacts:[];groups=Array.isArray(d.groups)?d.groups:[];$('policy').textContent=d.policy||'';$('recipient').innerHTML=contacts.map(c=>`<option value="${esc(c.user_id)}">${esc(c.label||c.email||c.role_label||c.role)}</option>`).join('')||'<option value="">لا يوجد مستلم متاح</option>';$('group').innerHTML=groups.map(g=>`<option value="${esc(g.key)}" data-count="${Number(g.count||0)}">${esc(g.label)} (${Number(g.count||0)})</option>`).join('')||'<option value="">لا توجد مجموعة متاحة</option>';updateGroupHint();if(!groups.length){$('targetMode').value='person';$('targetMode').querySelector('option[value="group"]').disabled=true}syncMode()}
function updateGroupHint(){const o=$('group').selectedOptions[0];$('groupHint').textContent=o&&o.value?`سيتم الإرسال إلى ${o.dataset.count||0} مستخدم/مستخدمين نشطين في هذه الفئة داخل المدرسة.`:''}
async function loadInbox(){const d=await PrivateSchoolBridge.messages('inbox');$('inbox').innerHTML=(d.messages||[]).map(m=>`<div class="row ${m.read_at?'':'unread'}" data-id="${esc(m.id)}"><div>${esc(m.subject||'بدون موضوع')}</div><small class="muted">${esc(m.sender_name||'')}</small></div>`).join('')||'<span class="muted">لا توجد رسائل</span>'}
$('targetMode').addEventListener('change',syncMode);$('group').addEventListener('change',updateGroupHint);
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='جارٍ الإرسال...';try{const payload={subject:$('subject').value.trim(),body:$('body').value.trim(),priority:$('priority').value};if($('targetMode').value==='group')payload.groupKey=$('group').value;else payload.recipientUserId=$('recipient').value;const d=await PrivateSchoolBridge.messages('send',payload);$('subject').value='';$('body').value='';$('msg').textContent=`تم الإرسال بنجاح إلى ${Number(d.recipientCount||1)} مستلم/مستلمين`;await loadInbox()}catch(x){$('msg').textContent=x.message||'تعذر الإرسال'}});
document.addEventListener('click',async e=>{const r=e.target.closest('.row[data-id]');if(!r)return;try{const d=await PrivateSchoolBridge.messages('read',{messageId:r.dataset.id});alert((d.message?.subject||'')+'\n\n'+(d.message?.body||''));await loadInbox()}catch(x){alert(x.message||'تعذر فتح الرسالة')}});await loadContacts();await loadInbox()})();
</script></body></html>
